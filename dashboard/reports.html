      color: #e0e0e0;

    }

    .auth-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);

    .auth-card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
      padding: 40px; text-align: center; width: 300px;
    }
    .auth-title { font-size: 18px; color: #fff; margin-bottom: 6px; }
    .auth-sub   { color: #9ca3af; font-size: 13px; margin-bottom: 24px; }
    #authError  { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 16px; }

    /* ── Breadcrumb ── */
    .breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; font-size: 13px; color: #9ca3af; }
    .breadcrumb a { color: #9ca3af; text-decoration: none; transition: color 0.15s; }
    .breadcrumb a:hover { color: #e0e0e0; }
    .breadcrumb-sep { opacity: 0.4; }

    /* ── Page header ── */
    .header { margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 400; color: #ffffff; }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      gap: 2px;
      margin-bottom: 24px;
      border-bottom: 1px solid #222;
      padding-bottom: 0;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #6b7280;
      font-size: 14.5px;
      font-family: inherit;
      font-weight: 500;
      padding: 8px 16px;
      margin-bottom: -1px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #e0e0e0; }
    .tab-btn.active { color: #ffffff; border-bottom-color: #22c55e; }

    /* ── Loading / spinner ── */
    #statusMsg { color: #6b7280; font-size: 14px; margin-bottom: 16px; min-height: 18px; }
    .loading-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 380px; gap: 12px; color: #6b7280;
    }
    .spinner {
      width: 28px; height: 28px; border: 2px solid #2a2a2a;
      border-top-color: #555; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════════════════════════════════
       TAB 1 — PnL vs Entry Volume
    ══════════════════════════════════════ */
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 12px 18px; min-width: 120px; }
    .stat-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .stat-value { font-size: 19px; font-weight: 500; color: #ffffff; }

      padding: 20px; margin-bottom: 28px; position: relative; height: 420px;
    }

    .table-wrap { background: #141414; border: 1px solid #222; border-radius: 10px; overflow: hidden; }
    .table-header {
      padding: 14px 16px; border-bottom: 1px solid #222;
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-title { font-size: 15px; font-weight: 600; color: #ffffff; }
    .table-count { font-size: 13px; color: #6b7280; }

      display: flex; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid #1a1a1a; flex-wrap: wrap;
    }
    .filter-btn {
      background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 6px;
      color: #9ca3af; font-size: 13px; padding: 4px 12px; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s; font-family: inherit;

    .filter-btn:hover, .filter-btn.active { background: #252525; color: #ffffff; border-color: #3a3a3a; }

    .vol-input {

    }
    .vol-input:focus { border-color: #555; }
    .vol-input.active { border-color: #22c55e; color: #22c55e; }
    .vol-sep { color: #3a3a3a; font-size: 13px; }
    .vol-preset {
      background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 6px;

      font-size: 15px; font-weight: 600; color: #ffffff;

      font-weight: 600;

      white-space: nowrap;

      align-items: center;

    .arrow-link {

    /* ── Window stats panel (screenshot style) ── */
    .win-stats-wrap {

      border: 1px solid #222;
      border-radius: 10px;
      padding: 20px 24px;
      margin-top: 24px;
    }
    .win-stats-title {
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;

    .ws-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border-bottom: 1px solid #1e1e1e;
      padding-bottom: 14px;

    /* ── Equity charts ── */

    .equity-card {
      background: #141414;

  </style>

<script>
'use strict';

/* ═══════════════════════════════════════════
   Shared state & utils
═══════════════════════════════════════════ */
let rawRoundtrips = [];
let rawDayStats   = [];

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((s, x) => s + (x - m) ** 2, 0) / (arr.length - 1));
}
function fmtSecs(s) {
  if (s == null || isNaN(s)) return '—';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

/* ═══════════════════════════════════════════
   Data loading
═══════════════════════════════════════════ */
async function loadAllData() {
  const idx = await fetch('calendar/calendar_index.json').then(r => r.json());
  rawRoundtrips = [];
  rawDayStats   = [];

  for (const year of idx.years) {
    let raw;
    try { raw = await fetch(`calendar/calendar_data_${year}.json`).then(r => r.json()); }
    catch { continue; }
    const months = raw[String(year)] ?? raw;
    for (const [month, mdata] of Object.entries(months)) {
      if (!mdata?.days) continue;
      for (const [day, ddata] of Object.entries(mdata.days)) {
        if (!ddata.roundtrips?.length) continue;
        const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        rawDayStats.push({ date: dateStr, pnl: ddata.pnl ?? 0, volume: ddata.stats?.volume ?? 0 });
        for (const rt of ddata.roundtrips) {
          rawRoundtrips.push({ date: dateStr, ...rt });
        }
      }
    }
  }

}

/* ═══════════════════════════════════════════
   TAB 2: Trading Stats
═══════════════════════════════════════════ */
const SCRATCH_THRESH = 0.05;

function computeStats(rts, days) {
  if (!rts.length) return null;

  const WINS = rts.filter(r => r.pnl >  SCRATCH_THRESH);
  const LOSS = rts.filter(r => r.pnl < -SCRATCH_THRESH);
  const SCRT = rts.filter(r => Math.abs(r.pnl) <= SCRATCH_THRESH);

  const totalPnl   = rts.reduce((s, r) => s + r.pnl, 0);
  const grossWin   = WINS.reduce((s, r) => s + r.pnl, 0);
  const grossLoss  = Math.abs(LOSS.reduce((s, r) => s + r.pnl, 0));
  const totalShares = rts.reduce((s, r) => s + (r.qty ?? 0), 0);

  const largestGain = rts.reduce((a, r) => r.pnl > a.pnl ? r : a, rts[0]);
  const largestLoss = rts.reduce((a, r) => r.pnl < a.pnl ? r : a, rts[0]);

  const dayPnls = days.map(d => d.pnl);
  const dayVols = days.map(d => d.volume).filter(v => v > 0);

  const avgWin  = WINS.length ? mean(WINS.map(r => r.pnl)) : 0;
  const avgLoss = LOSS.length ? mean(LOSS.map(r => r.pnl)) : 0;
  const avgTrade = mean(rts.map(r => r.pnl));
  const pnlStd  = stddev(rts.map(r => r.pnl));

  const winRate = rts.length ? WINS.length / rts.length : 0;
  const lossRate = rts.length ? LOSS.length / rts.length : 0;
  const profitFactor = grossLoss > 0 ? grossWin / grossLoss : null;
  const kelly = avgLoss !== 0 ? winRate - lossRate / Math.abs(avgLoss / avgWin) : null;

  // SQN = (E(R) / StdDev(R)) * sqrt(n)   where R = pnl per trade
  const sqn = pnlStd > 0 ? (avgTrade / pnlStd) * Math.sqrt(rts.length) : null;

  // Probability of random chance: simplified t-stat p-value
  // t = avgPnl / (stddev / sqrt(n))
  const tStat = pnlStd > 0 ? avgTrade / (pnlStd / Math.sqrt(rts.length)) : null;
  // Two-tailed p-value approximation
  let pValue = null;
  if (tStat !== null) {
    const x = Math.abs(tStat), df = rts.length - 1;
    // Simple approximation using normal distribution for large n
    if (df > 30) {
      pValue = 2 * (1 - erf(x / Math.SQRT2) / 2 - 0.5) * 100;
      pValue = Math.max(0, pValue);
    }
  }

  // Consecutive wins/losses (sort by date then entry_time)
  const sorted = [...rts].sort((a, b) => {
    const dk = a.date.localeCompare(b.date);
    return dk !== 0 ? dk : a.entry_time.localeCompare(b.entry_time);
  });
  let maxW = 0, maxL = 0, curW = 0, curL = 0;
  for (const r of sorted) {
    if (r.pnl > SCRATCH_THRESH)  { curW++; curL = 0; maxW = Math.max(maxW, curW); }
    else if (r.pnl < -SCRATCH_THRESH) { curL++; curW = 0; maxL = Math.max(maxL, curL); }
    else { curW = 0; curL = 0; }
  }

  // K-Ratio: linear regression on equity curve
  const equity = [];
  let cum = 0;
  for (const r of sorted) { cum += r.pnl; equity.push(cum); }
  const n = equity.length;
  const xs = Array.from({length: n}, (_, i) => i + 1);
  const my = mean(equity), mx = mean(xs);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    sxy += (xs[i] - mx) * (equity[i] - my);
    sxx += (xs[i] - mx) ** 2;
    syy += (equity[i] - my) ** 2;
  }
  const slope = sxx > 0 ? sxy / sxx : 0;
  const sse = equity.reduce((s, y, i) => s + (y - (slope * xs[i] + (my - slope * mx))) ** 2, 0);
  const se = n > 2 ? Math.sqrt(sse / (n - 2) / sxx) : 0;
  const kRatio = se > 0 ? slope / (se * Math.sqrt(n)) : null;

  return {
    totalPnl, grossWin, grossLoss, totalShares,
    largestGain, largestLoss,
    avgDailyPnl: dayPnls.length ? mean(dayPnls) : 0,
    avgDailyVol: dayVols.length ? Math.round(mean(dayVols)) : 0,
    avgPerShare: totalShares > 0 ? totalPnl / totalShares : 0,
    avgTrade, avgWin, avgLoss,
    n: rts.length, nWins: WINS.length, nLoss: LOSS.length, nDays: days.length,
    nScrat: SCRT.length, scratchPct: rts.length ? SCRT.length / rts.length * 100 : 0,
    winPct: winRate * 100,
    holdScrat: SCRT.length ? mean(SCRT.map(r => r.hold_secs ?? 0)) : null,
    holdWin:   WINS.length ? mean(WINS.map(r => r.hold_secs ?? 0)) : null,
    holdLoss:  LOSS.length ? mean(LOSS.map(r => r.hold_secs ?? 0)) : null,
    maxW, maxL,
    pnlStd, sqn, pValue, tStat, kelly, kRatio, profitFactor,
  };
}

// Simple erf approximation (for p-value)
function erf(x) {
  const t = 1 / (1 + 0.3275911 * Math.abs(x));
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return x >= 0 ? y : -y;
}

function dollar(v, sign = true) {
  const abs = Math.abs(v).toFixed(2);
  if (!sign) return '$' + abs;
  return (v >= 0 ? '+$' : '-$') + abs;
}

function renderStatsTable(s) {
  const grid = document.getElementById('statGrid');
  grid.innerHTML = '';

  const cell = (name, val, cls = '') => {
    const div = document.createElement('div');
    div.className = 'stat-cell';
    div.innerHTML = `<span class="stat-cell-name">${name}</span><span class="stat-cell-val ${cls}">${val}</span>`;
    return div;
  };

  const pnlClass = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';

  // Row 1
  grid.appendChild(cell('Total Gain/Loss', dollar(s.totalPnl), pnlClass(s.totalPnl)));
  grid.appendChild(cell('Largest Gain', dollar(s.largestGain.pnl, false), 'pos'));
  grid.appendChild(cell('Largest Loss', dollar(s.largestLoss.pnl), 'neg'));

  // Row 2
  grid.appendChild(cell('Average Daily Gain/Loss', dollar(s.avgDailyPnl), pnlClass(s.avgDailyPnl)));
  grid.appendChild(cell('Average Daily Volume', s.avgDailyVol.toLocaleString()));
  grid.appendChild(cell('Average Per-share Gain/Loss', dollar(s.avgPerShare), pnlClass(s.avgPerShare)));

  // Row 3
  grid.appendChild(cell('Average Trade Gain/Loss', dollar(s.avgTrade), pnlClass(s.avgTrade)));
  grid.appendChild(cell('Average Winning Trade', dollar(s.avgWin, false), 'pos'));
  grid.appendChild(cell('Average Losing Trade', dollar(s.avgLoss), 'neg'));

  // Row 4
  grid.appendChild(cell('Total Number of Trades', s.n.toLocaleString()));
  grid.appendChild(cell('Number of Winning Trades', `${s.nWins.toLocaleString()} (${s.winPct.toFixed(1)}%)`, 'pos'));
  grid.appendChild(cell('Number of Losing Trades',  `${s.nLoss.toLocaleString()} (${(s.nLoss/s.n*100).toFixed(1)}%)`, 'neg'));

  // Row 5
  grid.appendChild(cell('Avg Hold Time (scratch trades)', s.holdScrat != null ? fmtSecs(s.holdScrat) : '—'));
  grid.appendChild(cell('Avg Hold Time (winning trades)', s.holdWin  != null ? fmtSecs(s.holdWin)  : '—'));
  grid.appendChild(cell('Avg Hold Time (losing trades)',  s.holdLoss != null ? fmtSecs(s.holdLoss) : '—'));

  // Row 6
  grid.appendChild(cell('Number of Scratch Trades', `${s.nScrat} (${s.scratchPct.toFixed(1)}%)`));
  grid.appendChild(cell('Max Consecutive Wins',   String(s.maxW), 'pos'));
  grid.appendChild(cell('Max Consecutive Losses', String(s.maxL), 'neg'));

  // Row 7
  grid.appendChild(cell('Trade P&amp;L Std Deviation', '$' + s.pnlStd.toFixed(2)));
  grid.appendChild(cell('System Quality Number (SQN)', s.sqn != null ? s.sqn.toFixed(2) : 'n/a', s.sqn != null ? pnlClass(s.sqn) : 'na'));
  grid.appendChild(cell('Probability of Random Chance', s.pValue != null ? s.pValue.toFixed(1) + '%' : 'n/a'));

  // Row 8
  const kellyStr = s.kelly != null ? (s.kelly * 100).toFixed(1) + '%' : '&lt; 0%';
  const kellyCls = s.kelly != null ? pnlClass(s.kelly) : 'neg';
  grid.appendChild(cell('Kelly Percentage', kellyStr, kellyCls));
  grid.appendChild(cell('K-Ratio', s.kRatio != null ? s.kRatio.toFixed(2) : 'n/a', s.kRatio != null ? pnlClass(s.kRatio) : 'na'));
  grid.appendChild(cell('Profit Factor', s.profitFactor != null ? s.profitFactor.toFixed(2) : 'n/a', s.profitFactor != null ? pnlClass(s.profitFactor - 1) : 'na'));

  // Row 9
  grid.appendChild(cell('Total Commissions', '$0.00'));
  grid.appendChild(cell('Total Fees', 'n/a', 'na'));
  grid.appendChild(cell('Trading Days', String(s.nDays)));

  // Row 10
  grid.appendChild(cell('Gross Profit', '+$' + s.grossWin.toFixed(2), 'pos'));
  grid.appendChild(cell('Gross Loss',   '-$' + s.grossLoss.toFixed(2), 'neg'));
  grid.appendChild(cell('Total Shares Traded', s.totalShares.toLocaleString()));

  document.getElementById('statsSection').style.display = 'block';
}

let _ddChart = null, _cumChart = null;

function renderEquityCharts(rts) {
  const sorted = [...rts].sort((a, b) =>
    a.date.localeCompare(b.date) || a.entry_time.localeCompare(b.entry_time)
  );

  let cum = 0, peak = 0;
  const labels = [], cumData = [], ddData = [];
  for (const r of sorted) {
    cum  += r.pnl;
    peak  = Math.max(peak, cum);
    labels.push(r.date);
    cumData.push(+cum.toFixed(2));
    ddData.push(+(cum - peak).toFixed(2));
  }

  const chartOpts = (color, labelText) => ({
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: color === '#ef4444' ? ddData : cumData,
        borderColor: color,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.35,
        fill: false,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1a1a',
          borderColor: '#333',
          borderWidth: 1,
          titleColor: '#ffffff',
          bodyColor: '#9ca3af',
          padding: 10,
          callbacks: {
            title: items => items[0].label,
            label: item => `${labelText}: ${item.raw >= 0 ? '+' : ''}$${item.raw.toFixed(2)}`,
          },
        },
      },
      scales: {
        x: {
          ticks: {
            color: '#6b7280',
            font: { size: 11 },
            maxTicksLimit: 8,
            maxRotation: 0,
          },
          grid: { color: '#1e1e1e' },
        },
        y: {
          ticks: {
            color: '#6b7280',
            font: { size: 11 },
            callback: v => (v >= 0 ? '' : '-') + '$' + Math.abs(v).toFixed(0),
          },
          grid: { color: '#1e1e1e' },
        },
      },
    },
  });

  if (_ddChart)  _ddChart.destroy();
  if (_cumChart) _cumChart.destroy();
  _ddChart  = new Chart(document.getElementById('drawdownChart'), chartOpts('#ef4444', 'Drawdown'));
  _cumChart = new Chart(document.getElementById('cumulChart'),    chartOpts('#22c55e', 'Cum P&L'));
  document.getElementById('equityRow').style.display = '';
}


/* ═══════════════════════════════════════════
   Date Picker
═══════════════════════════════════════════ */
const PRESETS = [
  { key: 'today',      label: 'Today' },
  { key: 'yesterday',  label: 'Yesterday' },
  { key: 'last-7',     label: 'Last 7 Days' },
  { key: 'last-30',    label: 'Last 30 Days' },
  { key: 'this-month', label: 'This Month' },
  { key: 'last-month', label: 'Last Month' },
  { key: 'last-12mo',  label: 'Last 12 Months' },
  { key: 'ytd',        label: 'YTD' },
  { key: 'last-year',  label: 'Last Year' },
  { key: 'all-time',   label: 'All Time' },
  { key: 'custom',     label: 'Custom Range' },
];

let _pOpen        = false;
let _pendFrom     = null;
let _pendTo       = null;
let _appliedFrom  = null;
let _appliedTo    = null;
let _clickStage   = 0;
let _activePreset = 'this-month';
let _calBase      = (() => { const d = new Date(); d.setDate(1); return d; })();

function _getPresetRange(key) {
  const tradingDays = [...new Set(rawDayStats.map(d => d.date))].sort();
  const latestTrade = tradingDays[tradingDays.length - 1] ?? '';
  const prevTrade   = tradingDays[tradingDays.length - 2] ?? latestTrade;

  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
  const fmt = dt => dt.toISOString().slice(0, 10);
  const ymd = (yr, m, dy) => fmt(new Date(yr, m, dy));

  switch (key) {
    case 'today':      return { from: latestTrade, to: latestTrade };
    case 'yesterday':  return { from: prevTrade,   to: prevTrade };
    case 'last-7':     return { from: fmt(new Date(y, mo, d - 6)),  to: ymd(y, mo, d) };
    case 'last-30':    return { from: fmt(new Date(y, mo, d - 29)), to: ymd(y, mo, d) };
    case 'this-month': return { from: ymd(y, mo, 1), to: ymd(y, mo, d) };
    case 'last-month': { const lm = mo === 0 ? 11 : mo - 1, ly = mo === 0 ? y - 1 : y; return { from: ymd(ly, lm, 1), to: ymd(ly, lm, new Date(y, mo, 0).getDate()) }; }
    case 'last-12mo':  { const f = new Date(y, mo, d); f.setFullYear(y - 1); return { from: fmt(f), to: ymd(y, mo, d) }; }
    case 'ytd':        return { from: ymd(y, 0, 1), to: ymd(y, mo, d) };
    case 'last-year':  return { from: ymd(y - 1, 0, 1), to: ymd(y - 1, 11, 31) };
    default:           return { from: '', to: '' };
  }
}

function _fmtShort(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function _fmtRange(from, to) {
  if (!from && !to) return '—';
  if (!to || from === to) return _fmtShort(from);
  return `${_fmtShort(from)} – ${_fmtShort(to)}`;
}

function _renderPresets() {
  const el = document.getElementById('pickerPresets');
  el.innerHTML = '';
  for (const p of PRESETS) {
    const div = document.createElement('div');
    const isActive = p.key === _activePreset;
    div.className = 'preset-item' + (isActive ? ' active' : '');
    div.innerHTML = `${p.label}${isActive ? '<span class="preset-check">✓</span>' : ''}`;
    div.addEventListener('click', () => {
      _activePreset = p.key;
      if (p.key !== 'custom') {
        const r = _getPresetRange(p.key);
        _pendFrom = r.from || null;
        _pendTo   = r.to   || null;
        _clickStage = 0;
        if (_pendFrom) { const [cy, cm] = _pendFrom.split('-').map(Number); _calBase = new Date(cy, cm - 1, 1); }
      } else {
        _pendFrom = null; _pendTo = null; _clickStage = 0;
      }
      _renderPresets();
      _renderCals();
      _updateFooter();
    });
    el.appendChild(div);
  }
}

const _DOW    = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const _MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function _renderCalMonth(container, year, month, showPrev, showNext) {
  const todayStr = new Date().toISOString().slice(0, 10);
  container.innerHTML = '';

  const hdr = document.createElement('div');
  hdr.className = 'cal-header';
  const pBtn = document.createElement('button');
  pBtn.className = 'cal-nav'; pBtn.textContent = '‹';
  if (!showPrev) pBtn.style.visibility = 'hidden';
  pBtn.addEventListener('click', () => { _calBase = new Date(_calBase.getFullYear(), _calBase.getMonth() - 1, 1); _renderCals(); });
  const nBtn = document.createElement('button');
  nBtn.className = 'cal-nav'; nBtn.textContent = '›';
  if (!showNext) nBtn.style.visibility = 'hidden';
  nBtn.addEventListener('click', () => { _calBase = new Date(_calBase.getFullYear(), _calBase.getMonth() + 1, 1); _renderCals(); });
  const lbl = document.createElement('span');
  lbl.className = 'cal-month-label';
  lbl.textContent = `${_MONTHS[month]} ${year}`;
  hdr.append(pBtn, lbl, nBtn);
  container.appendChild(hdr);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  for (const d of _DOW) { const dh = document.createElement('div'); dh.className = 'cal-dow'; dh.textContent = d; grid.appendChild(dh); }

  const firstDow   = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev  = new Date(year, month, 0).getDate();

  for (let i = firstDow - 1; i >= 0; i--) {
    const c = document.createElement('div'); c.className = 'cal-day other-month'; c.textContent = daysInPrev - i; grid.appendChild(c);
  }

  for (let dy = 1; dy <= daysInMonth; dy++) {
    const dateStr = `${year}-${String(month + 1).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;
    const c = document.createElement('div');
    c.className = 'cal-day';
    c.textContent = dy;
    if (dateStr === todayStr) c.classList.add('is-today');

    const lo = _pendFrom && _pendTo ? (_pendFrom <= _pendTo ? _pendFrom : _pendTo) : _pendFrom;
    const hi = _pendFrom && _pendTo ? (_pendFrom <= _pendTo ? _pendTo : _pendFrom) : _pendFrom;
    if (lo && hi) {
      if (dateStr === lo && dateStr === hi) c.classList.add('range-start', 'range-end');
      else if (dateStr === lo) c.classList.add('range-start');
      else if (dateStr === hi) c.classList.add('range-end');
      else if (dateStr > lo && dateStr < hi) c.classList.add('in-range');
    } else if (lo && dateStr === lo) {
      c.classList.add('range-start', 'range-end');
    }

    c.addEventListener('click', () => {
      if (_clickStage === 0) {
        _pendFrom = dateStr; _pendTo = null; _clickStage = 1;
      } else {
        if (dateStr >= _pendFrom) { _pendTo = dateStr; }
        else { _pendTo = _pendFrom; _pendFrom = dateStr; }
        _clickStage = 0;
      }
      _activePreset = 'custom';
      _renderPresets();
      _renderCals();
      _updateFooter();
    });
    grid.appendChild(c);
  }

  const filled = firstDow + daysInMonth;
  const tail = filled % 7 === 0 ? 0 : 7 - (filled % 7);
  for (let dy = 1; dy <= tail; dy++) {
    const c = document.createElement('div'); c.className = 'cal-day other-month'; c.textContent = dy; grid.appendChild(c);
  }
  container.appendChild(grid);
}

function _renderCals() {
  const m1y = _calBase.getFullYear(), m1m = _calBase.getMonth();
  const m2 = new Date(m1y, m1m + 1, 1);
  _renderCalMonth(document.getElementById('cal1'), m1y, m1m, true, false);
  _renderCalMonth(document.getElementById('cal2'), m2.getFullYear(), m2.getMonth(), false, true);
}

function _updateFooter() {
  document.getElementById('pickerFooterLabel').textContent = _fmtRange(_pendFrom, _pendTo);
}

function _updateTriggerLabel() {
  const from = _appliedFrom, to = _appliedTo;
  let lo = from, hi = to;
  if (!lo || !hi) {
    const dates = [...new Set(rawRoundtrips.map(r => r.date))].sort();
    if (!lo && dates.length) lo = dates[0];
    if (!hi && dates.length) hi = dates[dates.length - 1];
  }
  document.getElementById('pickerLabel').textContent = _fmtRange(lo, hi);
  document.getElementById('pickerTrigger').classList.toggle('has-range', !!(lo || hi));
}

function _openPicker() {
  _pOpen = true;
  _pendFrom = _appliedFrom; _pendTo = _appliedTo; _clickStage = 0;
  if (_pendFrom) { const [cy, cm] = _pendFrom.split('-').map(Number); _calBase = new Date(cy, cm - 1, 1); }
  _renderPresets();
  _renderCals();
  _updateFooter();
  document.getElementById('pickerDropdown').style.display = 'flex';
}

function _closePicker() {
  _pOpen = false;
  document.getElementById('pickerDropdown').style.display = 'none';
}

function _applyPicker() {
  _appliedFrom = _pendFrom;
  _appliedTo   = _pendTo;
  _closePicker();
  _updateTriggerLabel();
  applyStatsDateFilter();
}

function applyStatsDateFilter() {
  let rts  = rawRoundtrips;
  let days = rawDayStats;
  const from = _appliedFrom, to = _appliedTo;
  if (from) { rts = rts.filter(r => r.date >= from); days = days.filter(d => d.date >= from); }
  if (to)   { rts = rts.filter(r => r.date <= to);   days = days.filter(d => d.date <= to);   }
  const s = computeStats(rts, days);
  if (s) renderStatsTable(s);
  if (rts.length) renderEquityCharts(rts);
}

document.getElementById('pickerTrigger').addEventListener('click', e => { e.stopPropagation(); _pOpen ? _closePicker() : _openPicker(); });
document.getElementById('pickerCancel').addEventListener('click', _closePicker);
document.getElementById('pickerApply').addEventListener('click', _applyPicker);
document.addEventListener('click', e => { if (_pOpen && !document.getElementById('pickerWrap').contains(e.target)) _closePicker(); });

/* ═══════════════════════════════════════════
   Init
═══════════════════════════════════════════ */
initAuth(async () => {
  try {
    await loadAllData();
    if (!rawRoundtrips.length) {
      document.getElementById('statusMsg').textContent = 'No data found.';
      return;
    }
    document.getElementById('statusMsg').textContent = '';

    // Apply default preset (this-month)
    const _defR = _getPresetRange(_activePreset);
    _appliedFrom = _defR.from || null;
    _appliedTo   = _defR.to   || null;
    _updateTriggerLabel();
    applyStatsDateFilter();
  } catch (e) {
    document.getElementById('statusMsg').textContent = 'Error: ' + e.message;
    console.error(e);
  }
});
</script>
