<!-- Serve with: python -m http.server 8000  (run from dashboard/ folder) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Month Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 640px)  { body { padding: 24px; } }
    @media (min-width: 1024px) { body { padding: 28px 32px; } }

    /* ── Header ─────────────────────────────────────── */
    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .header-row {
      display: flex;
      align-items: center;
      position: relative;
    }

    .header-row h1 {
      flex: 1;
    }

    .header-row .badge-group {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .header-row .nav-controls {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    /* ── Breadcrumb ──────────────────────────────────── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #9ca3af;
    }
    .breadcrumb a {
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.15s;
    }
    .breadcrumb a:hover { color: #f0f0f0; }
    .breadcrumb-sep { opacity: 0.4; }

    h1 {
      font-size: 20px;
      font-weight: 400;
      color: #ffffff;
    }

    .badge-group {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .month-badge {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.05em;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-pos  { background: rgb(2, 53, 37);  border-color: rgb(3, 98, 68);   color: #ffffff; }
    .badge-neg  { background: rgb(77, 13, 13); border-color: rgb(143, 25, 25); color: #ffffff; }
    .badge-zero { background: #1e1e1e; border-color: #333;    color: #ffffff; }

    .month-badge-sm {
      font-size: 14px;
      padding: 5px 10px;
    }

    .badge-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #333;
      color: #ffffff;
      border-radius: 6px;
      width: 40px;
      height: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover { background: #1e1e1e; }

    /* ── Month calendar table ────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .month-cal {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .month-cal th {
      color: #9ca3af;
      font-size: 13px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 8px 4px;
      border: 1px solid rgb(161, 161, 170);
    }
    .month-cal th.total-col { color: #c0c0c0; }

    .month-cal td {
      border: 1px solid rgb(161, 161, 170);
      vertical-align: top;
      padding: 4px;
      height: 150px;
    }

    /* Day cell content */
    .cell-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .cell-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .cell-top-row .cell-link-icon {
      color: #ffffff;
      opacity: 0.7;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .cell-top-row .cell-link-icon:hover { opacity: 1; }

    .cell-day-num {
      font-size: 14px;
      font-weight: 300;
      color: #ffffff;
    }

    .cell-pnl {
      font-size: 20px;
      font-weight: 400;
      color: #fff;
      margin: auto 0;
    }

    .cell-trades {
      font-size: 14px;
      font-weight: 400;
      color: #fff;
      padding-bottom: 5px;
    }

    /* Week total column */
    .cell-total {
      vertical-align: middle;
    }

    .cell-total-inner {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      height: 100%;
      gap: 4px;
    }

    /* Cell state colors */
    .mc-empty     { background: #0a0a0a; }
    .mc-nodata    { background: #111111; }
    .mc-win       { background: rgb(2, 53, 37); }
    .mc-loss      { background: rgb(77, 13, 13); }
    .mc-week-win  { background: rgb(2, 42, 29); }
    .mc-week-loss { background: rgb(60, 10, 10); }
    .mc-week-zero { background: #1a1a1a; }

    .mc-nodata.mc-weekend,
    .mc-empty.mc-weekend { background: rgb(41, 37, 36); }

    /* ── Cell split divider ─────────────────────────── */
    .cell-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.15);
      margin: 4px 0;
    }

    .cell-stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
      border-radius: 0 0 6px 6px;
      padding: 3px 6px 2px;
    }
    .cell-stat-green { background: rgb(1, 30, 21); }
    .cell-stat-red   { background: rgb(44, 8, 8); }

    .cell-stat-primary {
      font-size: 16px;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
    }

    .cell-stat-secondary {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      padding-bottom: 3px;
    }

    .cell-outlier-warn {
      font-size: 11px;
      color: #fbbf24;
      cursor: help;
      flex-shrink: 0;
      line-height: 1;
    }

    .th-worst-dow {
      background: rgba(120, 0, 0, 0.25) !important;
      color: #f87171 !important;
    }
    .th-best-dow {
      background: rgba(0, 120, 60, 0.25) !important;
      color: #4ade80 !important;
    }

    /* ── Error state ─────────────────────────────────── */
    .error { color: #f87171; padding: 20px; }

    /* ── Annual view ─────────────────────────────────── */
    .annual-view {
      margin-top: 32px;
    }

    .annual-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (min-width: 640px)  { .annual-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .annual-grid { grid-template-columns: repeat(4, 1fr); } }

    .mini-card { background: #0f0f0f; }

    .mini-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 6px;
    }

    .mini-label {
      font-size: 14px;
      font-weight: 400;
      color: #e0e0e0;
      flex: 1;
      min-width: 0;
    }

    .mini-badge {
      font-size: 16px;
      font-weight: 400;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }
    .mini-badge-pos  { background: rgb(2, 53, 37);  color: #fafaf9; border-color: rgb(3, 98, 68); }
    .mini-badge-neg  { background: rgb(77, 13, 13); color: #fafaf9; border-color: rgb(143, 25, 25); }
    .mini-badge-zero { background: #2a2a2a; color: #6b7280; border-color: #3f3f3f; }

    .mini-expand-btn {
      background: #000000;
      border: 1px solid #3f3f3f;
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
      line-height: 0;
      border-radius: 6px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .mini-expand-btn:hover { background: #2a2a2a; color: #e0e0e0; }
    .mini-expand-btn svg { width: 14px; height: 14px; display: block; }

    .ann-cal {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .ann-cal th {
      color: #9ca3af;
      font-size: 10px;
      font-weight: 400;
      text-align: center;
      padding: 4px 2px;
      border: 1px solid rgb(161, 161, 170);
    }
    .ann-cal td {
      border: 1px solid rgb(161, 161, 170);
      text-align: center;
      padding: 4px 2px;
      font-size: 14px;
      color: #e0e0e0;
      height: 26px;
    }
    .ann-empty              { background: rgb(41, 37, 36); }
    .ann-nodata             { background: transparent; }
    .ann-nodata.ann-weekend { background: rgb(41, 37, 36); }
    .ann-win  { background: rgb(2, 53, 37);  color: #fafaf9; }
    .ann-loss { background: rgb(77, 13, 13); color: #fafaf9; }

    /* ── Stats bar ───────────────────────────────────── */
    .stats-bar {
      background: #141414;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      padding: 12px 0;
      border-bottom: 1px solid #1e1e1e;
    }
    .stat-row:last-child { border-bottom: none; padding-bottom: 0; }
    .stat-row:first-child { padding-top: 0; }
    .stat-item { flex: 1 1 120px; min-width: 100px; padding: 4px 12px 4px 0; }
    .stat-value { font-size: 18px; font-weight: 500; color: #ffffff; line-height: 1.2; }
    .stat-label { font-size: 14px; color: #9ca3af; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
    .stats-tab-bar { display: flex; gap: 4px; margin-bottom: 14px; }
    .stats-tab { padding: 5px 14px; font-size: 12px; font-weight: 600; color: #6b7280; cursor: pointer; border: 1px solid #2a2a2a; border-radius: 6px; background: transparent; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.15s; }
    .stats-tab:hover { color: #e0e0e0; border-color: #444; }
    .stats-tab.active { color: #ffffff; background: #1e1e2e; border-color: #6366f1; }

    /* ── Auth overlay ───────────────────────────────── */
    .auth-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .auth-card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
      padding: 40px; text-align: center; width: 300px;
    }
    .auth-title { font-size: 18px; color: #fff; margin-bottom: 6px; }
    .auth-sub   { color: #9ca3af; font-size: 13px; margin-bottom: 24px; }
    #authError  { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 16px; }
  </style>
  <script src="auth.js"></script>
</head>
<body>
<script src="nav.js"></script>

<div id="authOverlay" class="auth-overlay" style="display:none">
  <div class="auth-card">
    <div class="auth-title">TC Trade Journal</div>
    <div class="auth-sub">Sign in to continue</div>
    <div id="g_id_onload"
      data-client_id="413954462899-jcup1smhjuh6londv3tcsmil17cog1vv.apps.googleusercontent.com"
      data-callback="_verify"
      data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-theme="filled_black"
      data-size="large" data-shape="rectangular"></div>
    <div id="authError"></div>
  </div>
</div>

<div class="breadcrumb">
  <a href="index.html">Calendar</a>
  <span class="breadcrumb-sep">›</span>
  <span id="breadcrumbMonth"></span>
</div>

<div class="header">
  <div class="header-row">
    <h1 id="pageTitle"></h1>
    <div class="badge-group">
      <span class="month-badge" id="pageBadge"></span>
      <span class="month-badge" id="accBadge"></span>
    </div>
    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn" title="Previous month">&#8592;</button>
      <button class="nav-btn" id="nextBtn" title="Next month">&#8594;</button>
    </div>
  </div>
</div>

<div class="table-wrap">
  <table class="month-cal" id="monthCal"></table>
</div>

<div class="stats-bar" id="statsBar" style="display:none"></div>

<div class="annual-view" id="annualView"></div>

<script>
  const MONTHS = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];

  let allData = {};
  let curYear, curMonth;

  function fmtHold(totalSecs) {
    const mins = Math.floor(totalSecs / 60);
    const secs = totalSecs % 60;
    return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }
  function fmtVolume(v) {
    if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
    if (v >= 1000) return (v/1000).toFixed(2).replace(/\.?0+$/,'')+'K';
    return String(v);
  }

  function computeStats(roundtrips) {
    const winning = roundtrips.filter(rt => rt.pnl > 0);
    const losing  = roundtrips.filter(rt => rt.pnl < 0);
    const totalPnl     = Math.round(roundtrips.reduce((s, rt) => s + rt.pnl, 0) * 100) / 100;
    const grossProfit  = winning.reduce((s, rt) => s + rt.pnl, 0);
    const grossLossAbs = Math.abs(losing.reduce((s, rt) => s + rt.pnl, 0));
    const oneSidedQty  = roundtrips.reduce((s, rt) => s + rt.qty, 0);
    const avgHold = arr => arr.length ? Math.round(arr.reduce((s, rt) => s + rt.hold_secs, 0) / arr.length) : 0;
    const avgCents = arr => {
      const valid = arr.filter(rt => rt.qty > 0);
      return valid.length ? Math.round(valid.reduce((s, rt) => s + rt.pnl / rt.qty, 0) / valid.length * 100000) / 100000 : 0;
    };
    return {
      pnl: totalPnl,
      trades: roundtrips.length,
      stats: {
        accuracy:          roundtrips.length ? Math.round(winning.length / roundtrips.length * 10000) / 100 : 0,
        profit_factor:     grossLossAbs > 0 ? Math.round(grossProfit / grossLossAbs * 100) / 100 : 0,
        volume:            Math.round(oneSidedQty * 2),
        avg_trade_pnl:     roundtrips.length ? Math.round(totalPnl / roundtrips.length * 100) / 100 : 0,
        avg_qty:           roundtrips.length ? Math.round(oneSidedQty / roundtrips.length) : 0,
        biggest_winner:    winning.length ? Math.round(Math.max(...winning.map(rt => rt.pnl)) * 100) / 100 : 0,
        avg_winning_trade: winning.length ? Math.round(grossProfit / winning.length * 100) / 100 : 0,
        winning_trades:    winning.length,
        avg_hold_win:      fmtHold(avgHold(winning)),
        avg_cents_win:     avgCents(winning),
        biggest_loser:     losing.length ? Math.round(Math.min(...losing.map(rt => rt.pnl)) * 100) / 100 : 0,
        avg_losing_trade:  losing.length ? Math.round(losing.reduce((s, rt) => s + rt.pnl, 0) / losing.length * 100) / 100 : 0,
        losing_trades:     losing.length,
        avg_hold_loss:     fmtHold(avgHold(losing)),
        avg_cents_loss:    avgCents(losing),
        wl_ratio:          (winning.length && losing.length) ? Math.round((grossProfit / winning.length) / (grossLossAbs / losing.length) * 100) / 100 : (winning.length ? Infinity : 0),
        longest_win_streak:   (() => { let c=0,m=0; for(const rt of roundtrips){if(rt.pnl>0){c++;if(c>m)m=c;}else if(rt.pnl<0)c=0;} return m; })(),
        longest_loss_streak:  (() => { let c=0,m=0; for(const rt of roundtrips){if(rt.pnl<0){c++;if(c>m)m=c;}else if(rt.pnl>0)c=0;} return m; })(),
        profit_concentration: grossProfit > 0 ? (() => { const sw=[...winning].sort((a,b)=>b.pnl-a.pnl); const n=Math.max(1,Math.ceil(sw.length*0.1)); return Math.round(sw.slice(0,n).reduce((s,rt)=>s+rt.pnl,0)/grossProfit*10000)/100; })() : 0,
      }
    };
  }

  const STAT_ICONS = {
    'PnL':                    `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16c.5-2 1.5-7 4-7 2 0 2 3 4 3 2.5 0 4.5-5 5-7"/></svg>`,
    'Fees &amp; Com':         `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>`,
    'Volume':                 `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></svg>`,
    'Total Trades':           `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M2 7v10"/><path d="M6 5v14"/><rect width="12" height="18" x="10" y="3" rx="2"/></svg>`,
    'Avg Trade PnL':          `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>`,
    'Avg Quantity':           `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>`,
    'Biggest Winner':         `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>`,
    'Avg Winning Trade':      `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>`,
    'Winning Trades':         `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="M11 12h10"/><path d="M11 16h7"/><path d="M11 20h4"/></svg>`,
    'Avg Hold Time (Win)':    `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M13.228 21.925A10 10 0 1 1 21.994 12.338"/><path d="M12 6v6l1.562.781"/><path d="m14 18 4-4 4 4"/><path d="M18 22v-8"/></svg>`,
    'Avg Cent / Share (Win)': `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="M12 7v10"/><path d="M15.4 10a4 4 0 1 0 0 4"/></svg>`,

  function renderStats(data) {
    const el = document.getElementById('statsBar');
    const hasData = data && data.trades > 0;
    if (!hasData) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    const s   = data?.stats || {};
    const pnl = data?.pnl || 0;
    function stat(value, label) {
      const icon = STAT_ICONS[label] || '';
      return `<div class="stat-item"><div class="stat-value">${value}</div><div class="stat-label">${icon}${label}</div></div>`;
    }
    el.innerHTML = `
      <div class="stat-row">
        ${stat(fmtBadge(pnl), 'PnL')}
        ${stat('$0.00', 'Fees &amp; Com')}
        ${stat(fmtWLRatio(s.wl_ratio), 'W/L Ratio')}
        ${stat((s.accuracy || 0).toFixed(2) + '%', 'Accuracy')}
        ${stat(s.profit_factor || 0, 'Profit Factor')}
        ${stat(fmtVolume(s.volume || 0), 'Volume')}
        ${stat(data.trades || 0, 'Total Trades')}
        ${stat(fmtBadge(s.avg_trade_pnl || 0), 'Avg Trade PnL')}
        ${stat((s.avg_qty || 0).toLocaleString('en-US'), 'Avg Quantity')}
      </div>
      <div class="stat-row">
        ${stat(fmtBadge(s.biggest_winner || 0), 'Biggest Winner')}
        ${stat(fmtBadge(s.avg_winning_trade || 0), 'Avg Winning Trade')}
        ${stat(s.winning_trades || 0, 'Winning Trades')}
        ${stat(s.avg_hold_win || '00:00', 'Avg Hold Time (Win)')}
        ${stat(s.avg_cents_win || 0, 'Avg Cent / Share (Win)')}
      </div>
      <div class="stat-row">
        ${stat(fmtBadge(s.biggest_loser || 0), 'Biggest Loser')}
        ${stat(fmtBadge(s.avg_losing_trade || 0), 'Avg Losing Trade')}
        ${stat(s.losing_trades || 0, 'Losing Trades')}
        ${stat(s.avg_hold_loss || '00:00', 'Avg Hold Time (Loss)')}
        ${stat(s.avg_cents_loss || 0, 'Avg Cent / Share (Loss)')}
      </div>
      <div class="stat-row">
        ${stat(s.longest_win_streak || 0, 'Longest Win Streak')}
        ${stat(s.longest_loss_streak || 0, 'Longest Loss Streak')}
        ${stat((s.profit_concentration || 0).toFixed(1) + '%', 'Top 10% Contribution')}
      </div>`;
  }

  function fmtDollars(abs) {
    return abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtBadge(pnl) {
    const sign = pnl >= 0 ? '' : '-';
    return `${sign}$${fmtDollars(Math.abs(pnl))}`;
  }

  function fmtAccuracy(acc) {
    if (acc === null || acc === undefined) return '—';
    return Math.round(acc) + '%';
  }

  function fmtPF(pf) {
    if (pf === null || pf === undefined) return '—';
    if (!isFinite(pf)) return '∞';
    return pf.toFixed(2);
  }

  function fmtWLRatio(ratio) {
    if (ratio === null || ratio === undefined) return '—';
    if (!isFinite(ratio)) return '∞';
    return ratio.toFixed(2) + '×';
  }

  /* ── Stats helpers ──────────────────────────────── */
  function computeDayStats(dayData) {
    if (!dayData) return null;
    const syms = Object.values(dayData.symbols || {});
    if (syms.length === 0) return { accuracy: null, pf: null };
    let wins = 0, grossProfit = 0, grossLoss = 0;
    for (const s of syms) {
      if ((s.pnl || 0) > 0) { wins++; grossProfit += s.pnl; }
      else if ((s.pnl || 0) < 0) { grossLoss += Math.abs(s.pnl); }
    }
    return {
      accuracy: wins / syms.length * 100,
      pf:       grossLoss > 0 ? grossProfit / grossLoss : (grossProfit > 0 ? Infinity : null),
    };
  }

  function computeMonthStats(days) {
    const rts = Object.values(days).flatMap(d => d?.roundtrips || []);
    if (rts.length === 0) return { accuracy: null, pf: null };
    const wins        = rts.filter(rt => rt.pnl > 0);
    const losses      = rts.filter(rt => rt.pnl < 0);
    const grossProfit = wins.reduce((s, rt) => s + rt.pnl, 0);
    const grossLoss   = Math.abs(losses.reduce((s, rt) => s + rt.pnl, 0));
    const avgWinAmt  = wins.length   ? grossProfit / wins.length   : 0;
    const avgLossAmt = losses.length ? grossLoss   / losses.length : 0;
    return {
      accuracy: wins.length / rts.length * 100,
      pf:       grossLoss > 0 ? grossProfit / grossLoss : (grossProfit > 0 ? Infinity : null),
      wl_ratio: avgLossAmt > 0 ? Math.round(avgWinAmt / avgLossAmt * 100) / 100 : (avgWinAmt > 0 ? Infinity : 0),
    };
  }

  function navigate(year, month) {
    const url = new URL(window.location.href);
    url.searchParams.set('year', year);
    url.searchParams.set('month', month);
    window.history.pushState({}, '', url);
    curYear  = year;
    curMonth = month;
    render();
  }

  function render() {
    const yearStr  = String(curYear);
    const monthStr = String(curMonth);
    const yearData  = allData[yearStr] || {};
    const monthData = yearData[monthStr] || { total: 0, trades: 0, days: {} };
    const total     = monthData.total || 0;
    const hasTrades = Object.keys(monthData.days).length > 0;

    document.title = `${MONTHS[curMonth - 1]} ${curYear}`;
    document.getElementById('pageTitle').textContent = `${MONTHS[curMonth - 1]}, ${curYear}`;
    document.getElementById('breadcrumbMonth').textContent = `${MONTHS[curMonth - 1]} ${curYear}`;

    const colorClass = !hasTrades ? 'badge-zero' : total >= 0 ? 'badge-pos' : 'badge-neg';

    const badge = document.getElementById('pageBadge');
    badge.className = 'month-badge ' + colorClass;
    badge.innerHTML = fmtBadge(total);

    const monthStats = computeMonthStats(monthData.days);

    const accBadge = document.getElementById('accBadge');
    accBadge.style.display = 'none';


    /* Build table */
    const cal = document.getElementById('monthCal');
    cal.innerHTML = '';

    /* Compute worst trading day-of-week for this month */
    const dowPnl = [0,0,0,0,0,0,0];
    for (const [dayStr, dd] of Object.entries(monthData.days)) {
      if (!dd) continue;
      dowPnl[new Date(curYear, curMonth - 1, parseInt(dayStr)).getDay()] += dd.pnl;
    }
    let worstTradingDow = -1, worstDowPnl = 0;
    let bestTradingDow  = -1, bestDowPnl  = 0;
    for (let dow = 1; dow <= 5; dow++) {
      if (dowPnl[dow] < worstDowPnl) { worstDowPnl = dowPnl[dow]; worstTradingDow = dow; }
      if (dowPnl[dow] > bestDowPnl)  { bestDowPnl  = dowPnl[dow]; bestTradingDow  = dow; }
    }

    /* thead */
    const thead = document.createElement('thead');
    const hrow  = document.createElement('tr');
    ['SUN','MON','TUE','WED','THU','FRI','SAT','TOTAL'].forEach((d, i) => {
      const th = document.createElement('th');
      th.textContent = d;
      if (i === 7) th.className = 'total-col';
      else if (i === worstTradingDow && worstDowPnl < 0) th.classList.add('th-worst-dow');
      else if (i === bestTradingDow  && bestDowPnl  > 0) th.classList.add('th-best-dow');
      hrow.appendChild(th);
    });
    thead.appendChild(hrow);
    cal.appendChild(thead);

    /* tbody */
    const firstDow    = new Date(curYear, curMonth - 1, 1).getDay();
    const daysInMonth = new Date(curYear, curMonth, 0).getDate();
    const numRows     = Math.ceil((firstDow + daysInMonth) / 7);
    const tbody       = document.createElement('tbody');
    let dayNum = 1;

    for (let row = 0; row < numRows; row++) {
      const tr = document.createElement('tr');
      let weekPnl        = 0;
      let weekTrades     = 0;
      let weekRoundtrips = [];

      for (let col = 0; col < 7; col++) {
        const cellIndex = row * 7 + col;
        const td = document.createElement('td');
        const isWeekend = col === 0 || col === 6;

        if (cellIndex < firstDow || dayNum > daysInMonth) {
          td.className = 'mc-empty' + (isWeekend ? ' mc-weekend' : '');
        } else {
          const dayData = monthData.days[String(dayNum)];
          if (!dayData) {
            td.className = 'mc-nodata' + (isWeekend ? ' mc-weekend' : '');
            const inner = document.createElement('div');
            inner.className = 'cell-inner';
            const numEl = document.createElement('div');
            numEl.className = 'cell-day-num';
            numEl.textContent = dayNum;
            inner.appendChild(numEl);
            td.appendChild(inner);
          } else {
            const isWin = dayData.pnl >= 0;
            td.className = isWin ? 'mc-win' : 'mc-loss';
            const dayRts = dayData.roundtrips || [];
            const worstRtPnl = dayRts.length ? Math.min(...dayRts.map(rt => rt.pnl)) : 0;
            const hasOutlier = worstRtPnl < -150;
            weekPnl    += dayData.pnl;
            weekTrades += dayData.trades;
            weekRoundtrips.push(...(dayData.roundtrips || []));

            const inner = document.createElement('div');
            inner.className = 'cell-inner';

            const topRow = document.createElement('div');
            topRow.className = 'cell-top-row';

            const numEl = document.createElement('div');
            numEl.className = 'cell-day-num';
            numEl.textContent = dayNum;

            const iconEl = document.createElement('a');
            iconEl.className = 'cell-link-icon';
            iconEl.href = `day.html?year=${curYear}&month=${curMonth}&day=${dayNum}`;
            iconEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M8 8h8v8"></path><path d="m8 16 8-8"></path></svg>`;

            if (hasOutlier) {
              const warnEl = document.createElement('span');
              warnEl.className = 'cell-outlier-warn';
              warnEl.title = `Outlier loss: ${fmtBadge(worstRtPnl)}`;
              warnEl.textContent = '⚠';
              topRow.appendChild(warnEl);
            }
            topRow.appendChild(numEl);
            topRow.appendChild(iconEl);

            const pnlEl = document.createElement('div');
            pnlEl.className = 'cell-pnl';
            pnlEl.textContent = fmtBadge(dayData.pnl);

            const trdEl = document.createElement('div');
            trdEl.className = 'cell-trades';
            trdEl.textContent = `Trades ${dayData.trades}`;

            inner.appendChild(topRow);
            inner.appendChild(pnlEl);
            inner.appendChild(trdEl);

            if (dayRts.length > 0) {
              const dayWins       = dayRts.filter(rt => rt.pnl > 0);
              const dayLosses     = dayRts.filter(rt => rt.pnl < 0);
              const dayAcc        = Math.round(dayWins.length / dayRts.length * 100);
              const avgWin        = dayWins.length  ? dayWins.reduce((s, rt) => s + rt.pnl, 0) / dayWins.length : 0;
              const avgLoss       = dayLosses.length ? Math.abs(dayLosses.reduce((s, rt) => s + rt.pnl, 0)) / dayLosses.length : 0;
              const dayWL         = avgLoss > 0 ? avgWin / avgLoss : (avgWin > 0 ? Infinity : 0);
              const pfStr         = isFinite(dayWL) ? dayWL.toFixed(2) : '∞';

              const divider = document.createElement('hr');
              divider.className = 'cell-divider';
              inner.appendChild(divider);

              const statEl = document.createElement('div');
              statEl.className = 'cell-stat ' + (isWin ? 'cell-stat-green' : 'cell-stat-red');

              const accEl = document.createElement('div');
              accEl.className = 'cell-stat-primary';
              accEl.textContent = `Acc ${dayAcc}%`;

              const pfEl = document.createElement('div');
              pfEl.className = 'cell-stat-secondary';
              pfEl.textContent = `W/L ${pfStr}`;

              statEl.appendChild(accEl);
              statEl.appendChild(pfEl);
              inner.appendChild(statEl);
            }

            td.appendChild(inner);
          }
          dayNum++;
        }
        tr.appendChild(td);
      }

      /* Week total cell */
      const totalTd = document.createElement('td');
      totalTd.className = 'cell-total ' +
        (weekTrades === 0 ? 'mc-week-zero' : weekPnl >= 0 ? 'mc-week-win' : 'mc-week-loss');

      if (weekTrades > 0) {
        const inner = document.createElement('div');
        inner.className = 'cell-total-inner';

        const pnlEl = document.createElement('div');
        pnlEl.className = 'cell-pnl';
        pnlEl.textContent = fmtBadge(weekPnl);

        const trdEl = document.createElement('div');
        trdEl.className = 'cell-trades';
        trdEl.textContent = `Trades ${weekTrades}`;

        inner.appendChild(pnlEl);
        inner.appendChild(trdEl);

        if (weekRoundtrips.length > 0) {
          const wWins    = weekRoundtrips.filter(rt => rt.pnl > 0);
          const wLosses  = weekRoundtrips.filter(rt => rt.pnl < 0);
          const wAcc     = Math.round(wWins.length / weekRoundtrips.length * 100);
          const wAvgWin  = wWins.length   ? wWins.reduce((s, rt) => s + rt.pnl, 0) / wWins.length : 0;
          const wAvgLoss = wLosses.length ? Math.abs(wLosses.reduce((s, rt) => s + rt.pnl, 0)) / wLosses.length : 0;
          const wWL      = wAvgLoss > 0 ? wAvgWin / wAvgLoss : (wAvgWin > 0 ? Infinity : 0);
          const wPFStr   = isFinite(wWL) ? wWL.toFixed(2) : '∞';

          const wDivider = document.createElement('hr');
          wDivider.className = 'cell-divider';
          inner.appendChild(wDivider);

          const wStatEl = document.createElement('div');
          wStatEl.className = 'cell-stat ' + (weekPnl >= 0 ? 'cell-stat-green' : 'cell-stat-red');

          const wAccEl = document.createElement('div');
          wAccEl.className = 'cell-stat-primary';
          wAccEl.textContent = `Acc ${wAcc}%`;

          const wPFEl = document.createElement('div');
          wPFEl.className = 'cell-stat-secondary';
          wPFEl.textContent = `W/L ${wPFStr}`;

          wStatEl.appendChild(wAccEl);
          wStatEl.appendChild(wPFEl);
          inner.appendChild(wStatEl);
        }

        totalTd.appendChild(inner);
      }
      tr.appendChild(totalTd);
      tbody.appendChild(tr);
    }

    cal.appendChild(tbody);

    /* Stats bar */
    const allRoundtrips = Object.values(monthData.days).flatMap(d => d?.roundtrips || []);
    renderStats(allRoundtrips.length ? computeStats(allRoundtrips) : { trades: 0 });

    buildAnnualView();
  }

  function buildAnnualView() {
    const yearData  = allData[String(curYear)] || {};
    const container = document.getElementById('annualView');
    container.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'annual-grid';
    for (let m = 1; m <= 12; m++) {
      const monthData = yearData[String(m)] || { total: 0, trades: 0, days: {} };
      grid.appendChild(buildMiniCard(curYear, m, monthData));
    }
    container.appendChild(grid);
  }

  function buildMiniCard(year, month, monthData) {
    const card = document.createElement('div');
    card.className = 'mini-card';

    const header = document.createElement('div');
    header.className = 'mini-header';

    const label = document.createElement('span');
    label.className = 'mini-label';
    label.textContent = `${MONTHS[month - 1]}, ${year}`;

    const hasTrades = Object.keys(monthData.days).length > 0;
    const total = monthData.total || 0;
    const badge = document.createElement('span');
    badge.className = 'mini-badge ' + (!hasTrades ? 'mini-badge-zero' : total >= 0 ? 'mini-badge-pos' : 'mini-badge-neg');
    badge.textContent = hasTrades ? fmtBadge(total) : '$0.00';

    const expandBtn = document.createElement('button');
    expandBtn.className = 'mini-expand-btn';
    expandBtn.title = 'Load this month';
    expandBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>`;
    expandBtn.onclick = () => {
      navigate(year, month);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    header.appendChild(label);
    header.appendChild(badge);
    header.appendChild(expandBtn);
    card.appendChild(header);

    const table = document.createElement('table');
    table.className = 'ann-cal';

    const thead = document.createElement('thead');
    const hrow  = document.createElement('tr');
    ['sun','mon','tue','wed','thu','fri','sat'].forEach(d => {
      const th = document.createElement('th');
      th.textContent = d;
      hrow.appendChild(th);
    });
    thead.appendChild(hrow);
    table.appendChild(thead);

    const firstDow    = new Date(year, month - 1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    const numRows     = Math.ceil((firstDow + daysInMonth) / 7);
    const tbody       = document.createElement('tbody');
    let dayNum = 1;

    for (let row = 0; row < numRows; row++) {
      const tr = document.createElement('tr');
      for (let col = 0; col < 7; col++) {
        const cellIndex = row * 7 + col;
        const td = document.createElement('td');
        const isWeekend = col === 0 || col === 6;
        if (cellIndex < firstDow || dayNum > daysInMonth) {
          td.className = 'ann-empty';
        } else {
          const dayData = monthData.days[String(dayNum)];
          if (!dayData) {
            td.className = 'ann-nodata' + (isWeekend ? ' ann-weekend' : '');
          } else {
            td.className = dayData.pnl >= 0 ? 'ann-win' : 'ann-loss';
          }
          td.textContent = dayNum;
          dayNum++;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    card.appendChild(table);
    return card;
  }

  document.getElementById('prevBtn').onclick = () => {
    let m = curMonth - 1, y = curYear;
    if (m < 1) { m = 12; y--; }
    navigate(y, m);
  };
  document.getElementById('nextBtn').onclick = () => {
    let m = curMonth + 1, y = curYear;
    if (m > 12) { m = 1; y++; }
    navigate(y, m);
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  document.getElementById('prevBtn').click();
    if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  });

  /* ── Load data ──────────────────────────────────── */
  const params = new URLSearchParams(window.location.search);
  curYear  = parseInt(params.get('year')  || new Date().getFullYear());
  curMonth = parseInt(params.get('month') || new Date().getMonth() + 1);

  async function init() {
    try {
      const idx   = await fetch('calendar/calendar_index.json').then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
      const files = await Promise.all(idx.years.map(yr =>
        fetch(`calendar/calendar_data_${yr}.json`).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      ));
      allData = Object.assign({}, ...files);
      render();
    } catch (err) {
      document.getElementById('monthCal').innerHTML =
        `<tr><td class="error">Error loading data: ${err.message}<br>
        Run: <code>python calendar_data.py</code></td></tr>`;
    }
  }

  initAuth(() => init());
</script>
</body>
</html>
