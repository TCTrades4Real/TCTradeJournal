<!-- Serve with: python -m http.server 8000  (run from dashboard/ folder) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candlestick Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dim: #4f46e5;
      --primary-light: #818cf8;
      --bg-dark: #0f0f0f;
      --bg-card: #141414;
      --bg-input: #1f1f1f;
      --text-primary: #e0e0e0;
      --text-secondary: #6b7280;
      --accent-red: #f43f5e;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --accent-green: #22c55e;
      --accent-purple: #a855f7;
      --grid-color: rgba(30, 30, 30, 0.8);
      --glass-border: #222222;
      --glass-bg: #141414;
      --bg-gradient-start: #0f0f0f;
      --bg-gradient-mid: #0f0f0f;
      --bg-gradient-end: #0f0f0f;
      --radial-glow-1: transparent;
      --radial-glow-2: transparent;
      --chart-bg: #141414;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: var(--text-primary);
      font-size: 15px;
      min-height: 100vh;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }
    body::before { display: none; }

    .page-hdr {
      padding: 16px 16px 0;
    }
    @media (min-width: 640px)  { .page-hdr { padding: 24px 24px 0; } }
    @media (min-width: 1024px) { .page-hdr { padding: 28px 32px 0; } }

    .charts-wrap {
      padding: 0 8px 16px;
    }
    @media (min-width: 1024px) { .charts-wrap { padding: 0 12px 20px; } }

    /* ── Breadcrumb ──────────────────────────────────── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #9ca3af;
    }
    .breadcrumb a {
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.15s;
    }
    .breadcrumb a:hover { color: var(--text-primary); }
    .breadcrumb-sep { opacity: 0.4; }

    /* ── Header ──────────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 30px;
      font-weight: 400;
      color: #ffffff;
      flex: 1;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
      text-decoration: none;
    }
    .nav-btn:hover { background: #242424; color: var(--text-primary); border-color: #3a3a3a; }
    .nav-btn.disabled { opacity: 0.25; pointer-events: none; }

    /* ── Symbol pills ─────────────────────────────────── */
    .sym-pills {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      min-height: 36px;
    }

    .sym-pills-inner {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .sym-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--bg-input);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
      width: 100%;
    }
    .sym-pill:hover { background: #2a2a2a; color: #ffffff; border-color: #3a3a3a; }
    .sym-pill.active-pos,
    .sym-pill.active-neg,
    .sym-pill.active-zero { background: #2f2f2f; border-color: #888888; color: #ffffff; }
    .sym-pill-name { font-size: 13px; font-weight: 600; }
    .sym-pill-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .pill-sub {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid transparent;
      line-height: 1.4;
    }
    .pill-sub.pos  { background: rgb(11,98,71);   border-color: rgb(11,98,71);   color: #ffffff; opacity: 1; }
    .pill-sub.neg  { background: rgb(140,31,31);  border-color: rgb(140,31,31);  color: #ffffff; opacity: 1; }
    .pill-sub.zero { background: #333;            border-color: #555;            color: #9ca3af; opacity: 1; }
    .pill-sub-label { font-size: 10px; font-weight: 600; opacity: 1; margin-right: 5px; letter-spacing: 0.04em; }
    .pill-sub.pos  .pill-sub-label { color: rgb(134,239,172); }
    .pill-sub.neg  .pill-sub-label { color: rgb(252,165,165); }
    .pill-sub.zero .pill-sub-label { color: #9ca3af; }

    /* ── Sim toggle switch ───────────────────────────── */


    /* ── Timeframe selector ──────────────────────────── */
    .tf-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tf-btn {
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tf-btn:hover { background: #242424; color: var(--text-primary); }
    .tf-btn.active { background: #2a2a2a; color: #ffffff; border-color: #3a3a3a; }
    .tf-btn2 {
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tf-btn2:hover { background: #242424; color: var(--text-primary); }
    .tf-btn2.active { background: #2a2a2a; color: #ffffff; border-color: #3a3a3a; }


    /* ── Toggle switch ───────────────────────────────── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: 8px;
      font-size: 14px;
      color: #9ca3af;
      cursor: pointer;
      user-select: none;
    }
    .toggle-track {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-track.on { background: rgba(99, 102, 241, 0.4); }
    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(20px); background: #ffffff; }

    /* ── Trade selector ──────────────────────────────── */
    /* ── Legend row ──────────────────────────────────── */
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-arrow-up   { color: #089981; font-size: 13px; }
    .legend-arrow-down { color: #f23645; font-size: 13px; }
    .exit-tag {
      font-size: 10px; font-weight: 600; font-family: monospace;
      background: rgba(196,181,253,0.12); color: #c4b5fd;
      border: 1px solid rgba(196,181,253,0.25); border-radius: 3px;
      padding: 1px 4px; white-space: nowrap;
    }

    /* ── Chart container ──────────────────────────────── */
    .chart-outer {
      background: #000000;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .pane-handle {
      position: absolute;
      left: 0; right: 0;
      height: 8px;
      margin-top: -4px;
      cursor: ns-resize;
      z-index: 15;
      touch-action: none;
    }
    .pane-handle::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 3px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      transition: background 0.15s;
    }
    .pane-handle:hover::after,
    .pane-handle.dragging::after { background: rgba(255,255,255,0.35); }

    .chart-outer:-webkit-full-screen { border-radius: 0; }
    .chart-outer:-webkit-full-screen #chartMain { height: 100vh; }
    .chart-outer:fullscreen { border-radius: 0; }
    .chart-outer:fullscreen #chartMain { height: 100vh; }

    #chartInner {
      width: 100%;
    }
    #chartMain {
      height: 660px;
    }

    #btnFullscreen {
      position: absolute;
      top: 8px;
      right: 72px;
      z-index: 10;
      background: rgba(20,20,20,0.75);
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #6b7280;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.15s, background 0.15s;
    }
    #btnFullscreen:hover { color: #e0e0e0; background: rgba(40,40,40,0.95); }

    /* ── Hover tooltip ───────────────────────────────── */
    #hoverTooltip {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 20;
      background: rgba(8, 8, 26, 0.92);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 12px;
      color: var(--text-primary);
      pointer-events: none;
      display: none;
      line-height: 1.75;
      min-width: 130px;
    }
    #hoverTooltip.visible { display: block; }
    #dotTooltip {
      position: fixed;
      z-index: 9100;
      background: rgba(8, 8, 26, 0.92);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text-primary);
      pointer-events: none;
      display: none;
      line-height: 1.6;
      white-space: nowrap;
    }
    .tip-time { color: var(--text-secondary); font-size: 11px; margin-bottom: 2px; }
    .tip-row { display: flex; justify-content: space-between; gap: 14px; }
    .tip-label { font-variant-numeric: tabular-nums; }
    .tip-val   { font-variant-numeric: tabular-nums; text-align: right; }
    .tip-divider { border-top: 1px solid var(--glass-border); margin: 4px 0; }

    @keyframes videoHaloPulse {
      0%, 100% { opacity: 0.9; }
      50%      { opacity: 0.25; }
    }

    /* ── Trade video modal ────────────────────────────── */
    #videoModalOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9500;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
    }
    #videoModalOverlay.open { display: flex; }
    #videoModalBox {
      position: relative;
      width: min(920px, 92vw);
      background: #08081a;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    #videoModalOverlay.fullscreen #videoModalBox {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      max-width: none;
    }
    #videoModalFrameWrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    #videoModalOverlay.fullscreen #videoModalFrameWrap {
      height: calc(100vh - 44px);
      aspect-ratio: auto;
    }
    #videoModalFrameWrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #videoModalBar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px 8px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--glass-border);
    }
    .video-modal-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      border-radius: 5px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }
    .video-modal-btn:hover { background: rgba(255,255,255,0.16); }

    /* ── Status overlay ───────────────────────────────── */
    #chartStatus {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #000000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 40px;
      text-align: center;
    }
    #chartStatus.visible { display: flex; }

    .status-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--text-secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg { color: var(--text-secondary); font-size: 14px; }
    .status-msg.error { color: #f87171; }
    .status-hint { color: var(--text-secondary); font-size: 12px; max-width: 480px; line-height: 1.6; }
    .status-hint code { background: var(--bg-input); padding: 1px 5px; border-radius: 3px; color: #d1d5db; }

    /* ── Long Position Tool ─────────────────────────── */
    .tool-btn {
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .tool-btn:hover { background: #242424; color: var(--text-primary); }
    .tool-btn.active { background: #2a2a2a; color: #ffffff; border-color: #3a3a3a; }

    #longPosPanel {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    #longPosPanel.visible { display: flex; }
    #longPosShares {
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 12px;
      font-family: inherit;
      padding: 3px 7px;
      width: 72px;
      text-align: right;
    }
    #longPosShares:focus { outline: none; border-color: var(--glass-border); }
    #longPosRR { color: #d1d5db; font-weight: 500; }
    .lp-clear {
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }
    .lp-clear:hover { color: var(--text-primary); border-color: var(--glass-border); }

    /* ── Auth overlay ───────────────────────────────── */
    .auth-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .auth-card {
      background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 40px; text-align: center; width: 300px;
    }
    .auth-title { font-size: 18px; color: #fff; margin-bottom: 6px; }
    .auth-sub   { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
    #authError  { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 16px; }

    /* ── Dual chart layout ──────────────────────────── */
    .charts-row {
      display: flex;
      gap: 8px;
    }
    .charts-row > .chart-outer {
      flex: 1;
      min-width: 0;
    }
    #chartMain2 {
      height: 660px;
    }
    #hoverTooltip2 {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 20;
      background: rgba(8, 8, 26, 0.92);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 12px;
      color: var(--text-primary);
      pointer-events: none;
      display: none;
      line-height: 1.75;
      min-width: 130px;
    }
    #hoverTooltip2.visible { display: block; }
    #chartStatus2 {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #000000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 40px;
      text-align: center;
    }
    #chartStatus2.visible { display: flex; }
    .chart-tf-label {
      position: absolute;
      bottom: 28px;
      right: 50px;
      z-index: 10;
      background: rgba(20,20,20,0.75);
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      color: #6b7280;
      pointer-events: none;
    }
  </style>
  <script src="auth.js"></script>
</head>
<body>
<script src="nav.js"></script>
<script>
  (function(){
    var s = document.createElement('style');
    s.textContent = 'body{margin-left:200px!important;margin-right:0!important;transition:none!important;}';
    document.head.appendChild(s);
  })();
</script>

<div id="authOverlay" class="auth-overlay" style="display:none">
  <div class="auth-card">
    <div class="auth-title">TC Trade Journal</div>
    <div class="auth-sub">Sign in to continue</div>
    <div id="g_id_onload"
      data-client_id="413954462899-jcup1smhjuh6londv3tcsmil17cog1vv.apps.googleusercontent.com"
      data-callback="_verify"
      data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-theme="filled_black"
      data-size="large" data-shape="rectangular"></div>
    <div id="authError"></div>
  </div>
</div>

<div class="page-hdr">
<div class="breadcrumb">
  <a href="index.html">Calendar</a>
  <span class="breadcrumb-sep">›</span>
  <a id="breadcrumbMonth" href="#">Month</a>
  <span class="breadcrumb-sep">›</span>
  <a id="breadcrumbDay" href="#">Day</a>
  <span class="breadcrumb-sep">›</span>
  <span>Candlestick</span>
</div>

<div class="page-header">
  <div class="page-title" id="pageTitle">Candlestick Chart</div>
  <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
    <label class="toggle-wrap" onclick="toggleRothPills()" style="cursor:pointer;user-select:none;">
      <div class="toggle-track" id="rothTrack"><div class="toggle-thumb"></div></div>
      Roth
    </label>
    <div style="display:flex;gap:6px;">
      <button class="nav-btn disabled" id="btnPrev" title="Previous trading day">&#8592;</button>
      <button class="nav-btn disabled" id="btnNext" title="Next trading day">&#8594;</button>
    </div>
  </div>
</div>

<div class="sym-pills" id="symPills"></div>
</div>

<div class="charts-wrap">
<div style="height:16px;"></div>

<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
  <span style="font-size:12px;color:#6b7280;white-space:nowrap">Left</span>
  <div class="tf-selector" id="tfSelector" style="margin-bottom:0">
    <button class="tf-btn" data-tf="1">1m</button>
    <button class="tf-btn" data-tf="2">2m</button>
    <button class="tf-btn active" data-tf="5">5m</button>
  </div>
  <div style="width:1px;height:22px;background:var(--glass-border);flex-shrink:0;"></div>
  <span style="font-size:12px;color:#6b7280;white-space:nowrap">Right</span>
  <div class="tf-selector" id="tfSelector2" style="margin-bottom:0">
    <button class="tf-btn2 active" data-tf="1">1m</button>
    <button class="tf-btn2" data-tf="2">2m</button>
    <button class="tf-btn2" data-tf="5">5m</button>
  </div>

  const MONTHS = [

  let activeSymbol    = null;

  let activeExecs       = [];     // executions for active symbol
  let ohlcvCache        = {};     // loaded from ohlcv_YYYY-MM-DD.json
  let tradingDays       = [];     // sorted list of {year,month,day} objects with trade data

  let longPosMode  = false;       // long position tool toggled on
  let longPositions = [];         // array of { entry, target, stop, t0, t1 }
  let lpSvg        = null;        // SVG overlay element
  let lpSubCleanup = null;        // fn to unsubscribe chart events

  let rulerMode    = false;       // ruler tool active (shared by both charts)
  // Per-chart ruler state: rulers = array of locked { t0, p0, t1, p1 }; activeRuler = in-progress ruler (t1/p1 null = preview phase)
  const rulerState1 = { rulers: [], activeRuler: null, svg: null, subCleanup: null, liveX: 0, liveY: 0 };
  const rulerState2 = { rulers: [], activeRuler: null, svg: null, subCleanup: null, liveX: 0, liveY: 0 };
  function rulerCtx(which) {
    return which === 2
      ? { state: rulerState2, chartInst: chartInstance2, seriesRef: candleSeriesRef2, containerId: 'chartMain2', bars: activeBars2 }
      : { state: rulerState1, chartInst: chartInstance,  seriesRef: candleSeriesRef,  containerId: 'chartMain',  bars: activeBars  };
  }
  let activeBars   = null;        // aggregated bars at current timeframe (for snap)

  let activeAccounts  = new Set(['cash']);
  let allSymbolExecs  = [];       // all execs for current symbol (unfiltered by account)
  let rothPillsVisible = false;

  // Trade video links
  let tradeVideos = {};
  const VIDEO_TOKEN = 'TCJ_VIDEO_TOKEN_2025';
  const VIDEO_API   = 'save_video.php';

  // Video modal (YouTube popup, maximizable)
  const videoModalOverlay = document.getElementById('videoModalOverlay');
  const videoModalFrame   = document.getElementById('videoModalFrame');
  const videoModalMaxBtn  = document.getElementById('videoModalMaxBtn');
  const videoModalCloseBtn = document.getElementById('videoModalCloseBtn');

  function youtubeEmbedUrl(url) {
    let id = null, start = null;
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtu.be')) {
        id = u.pathname.slice(1);
      } else if (u.hostname.includes('youtube.com')) {
        if (u.pathname === '/watch') id = u.searchParams.get('v');
        else if (u.pathname.startsWith('/embed/')) id = u.pathname.split('/')[2];
        else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
      }
      const t = u.searchParams.get('t') || u.searchParams.get('start');
      if (t) start = parseInt(t, 10) || null;
    } catch (_) { /* not a full URL */ }
    if (!id) return null;
    let embed = `https://www.youtube.com/embed/${id}?autoplay=1`;
    if (start) embed += `&start=${start}`;
    return embed;
  }

  function openVideoModal(url) {
    const embed = youtubeEmbedUrl(url);
    videoModalFrame.src = embed || url;
    videoModalOverlay.classList.add('open');
  }

  function closeVideoModal() {

  videoModalCloseBtn.addEventListener('click', closeVideoModal);
  videoModalOverlay.addEventListener('click', e => {

  document.addEventListener('keydown', e => {
