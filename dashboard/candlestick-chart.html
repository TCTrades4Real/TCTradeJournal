<!-- Serve with: python -m http.server 8000  (run from dashboard/ folder) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candlestick Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dim: #4f46e5;
      --primary-light: #818cf8;
      --bg-dark: #0f0f0f;
      --bg-card: #141414;
      --bg-input: #1f1f1f;
      --text-primary: #e0e0e0;
      --text-secondary: #6b7280;
      --accent-red: #f43f5e;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --accent-green: #22c55e;
      --accent-purple: #a855f7;
      --grid-color: rgba(30, 30, 30, 0.8);
      --glass-border: #222222;
      --glass-bg: #141414;
      --bg-gradient-start: #0f0f0f;
      --bg-gradient-mid: #0f0f0f;
      --bg-gradient-end: #0f0f0f;
      --radial-glow-1: transparent;
      --radial-glow-2: transparent;
      --chart-bg: #141414;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: var(--text-primary);
      font-size: 15px;
      min-height: 100vh;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }
    body::before { display: none; }

    .page-hdr {
      padding: 16px 16px 0;
    }
    @media (min-width: 640px)  { .page-hdr { padding: 24px 24px 0; } }
    @media (min-width: 1024px) { .page-hdr { padding: 28px 32px 0; } }

    .charts-wrap {
      padding: 0 8px 16px;
    }
    @media (min-width: 1024px) { .charts-wrap { padding: 0 12px 20px; } }

    /* ── Header ──────────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 30px;
      font-weight: 400;
      color: #ffffff;
      flex: 1;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
      text-decoration: none;
    }
    .nav-btn:hover { background: #242424; color: var(--text-primary); border-color: #3a3a3a; }
    .nav-btn.disabled { opacity: 0.25; pointer-events: none; }

    /* ── Symbol pills ─────────────────────────────────── */
    .sym-pills {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      min-height: 36px;
    }

    .sym-pills-inner {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .sym-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--bg-input);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
      width: 100%;
    }
    .sym-pill:hover { background: #2a2a2a; color: #ffffff; border-color: #3a3a3a; }
    .sym-pill.active-pos,
    .sym-pill.active-neg,
    .sym-pill.active-zero { background: #2f2f2f; border-color: #888888; color: #ffffff; }
    .sym-pill-name { font-size: 13px; font-weight: 600; }
    .sym-pill-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .pill-sub {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid transparent;
      line-height: 1.4;
    }
    .pill-sub.pos  { background: rgb(11,98,71);   border-color: rgb(11,98,71);   color: #ffffff; opacity: 1; }
    .pill-sub.neg  { background: rgb(140,31,31);  border-color: rgb(140,31,31);  color: #ffffff; opacity: 1; }
    .pill-sub.zero { background: #333;            border-color: #555;            color: #9ca3af; opacity: 1; }
    .pill-sub-label { font-size: 10px; font-weight: 600; opacity: 1; margin-right: 5px; letter-spacing: 0.04em; flex-shrink: 0; }
    .pill-sub.pos  .pill-sub-label { color: rgb(134,239,172); }
    .pill-sub.neg  .pill-sub-label { color: rgb(252,165,165); }
    .pill-sub.zero .pill-sub-label { color: #9ca3af; }

    /* ── Sim toggle switch ───────────────────────────── */


    /* ── Timeframe selector ──────────────────────────── */
    .tf-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tf-btn {
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tf-btn:hover { background: #242424; color: var(--text-primary); }
    .tf-btn.active { background: #2a2a2a; color: #ffffff; border-color: #3a3a3a; }


    /* ── Toggle switch ───────────────────────────────── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: 8px;
      font-size: 14px;
      color: #9ca3af;
      cursor: pointer;
      user-select: none;
    }
    .toggle-track {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-track.on { background: rgba(99, 102, 241, 0.4); }
    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(20px); background: #ffffff; }

    /* ── Trade selector ──────────────────────────────── */
    /* ── Legend row ──────────────────────────────────── */
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-arrow-up   { color: #089981; font-size: 13px; }
    .legend-arrow-down { color: #f23645; font-size: 13px; }
    .exit-tag {
      font-size: 10px; font-weight: 600; font-family: monospace;
      background: rgba(196,181,253,0.12); color: #c4b5fd;
      border: 1px solid rgba(196,181,253,0.25); border-radius: 3px;
      padding: 1px 4px; white-space: nowrap;
    }

    /* ── Chart container ──────────────────────────────── */
    .chart-outer {
      background: #000000;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .pane-handle {
      position: absolute;
      left: 0; right: 0;
      height: 8px;
      margin-top: -4px;
      cursor: ns-resize;
      z-index: 15;
      touch-action: none;
    }
    .pane-handle::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 3px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      transition: background 0.15s;
    }
    .pane-handle:hover::after,
    .pane-handle.dragging::after { background: rgba(255,255,255,0.35); }

    .chart-outer:-webkit-full-screen { border-radius: 0; }
    .chart-outer:-webkit-full-screen #chartMain { height: 100vh; }
    .chart-outer:fullscreen { border-radius: 0; }
    .chart-outer:fullscreen #chartMain { height: 100vh; }

    #chartInner {
      width: 100%;
    }
    #chartMain {
      height: 660px;
    }

    #btnFullscreen {
      position: absolute;
      top: 8px;
      right: 72px;
      z-index: 10;
      background: rgba(20,20,20,0.75);
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #6b7280;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.15s, background 0.15s;
    }
    #btnFullscreen:hover { color: #e0e0e0; background: rgba(40,40,40,0.95); }

    /* ── Hover tooltip ───────────────────────────────── */
    #hoverTooltip {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 20;
      background: rgba(8, 8, 26, 0.92);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 12px;
      color: var(--text-primary);
      pointer-events: none;
      display: none;
      line-height: 1.75;
      min-width: 130px;
    }
    #hoverTooltip.visible { display: block; }
    #dotTooltip {
      position: fixed;
      z-index: 9100;
      background: rgba(8, 8, 26, 0.92);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text-primary);
      pointer-events: none;
      display: none;
      line-height: 1.6;
      white-space: nowrap;
    }
    .tip-time { color: var(--text-secondary); font-size: 11px; margin-bottom: 2px; }
    .tip-row { display: flex; justify-content: space-between; gap: 14px; }
    .tip-label { font-variant-numeric: tabular-nums; }
    .tip-val   { font-variant-numeric: tabular-nums; text-align: right; }
    .tip-divider { border-top: 1px solid var(--glass-border); margin: 4px 0; }

    /* ── Status overlay ───────────────────────────────── */
    #chartStatus {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #000000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 40px;
      text-align: center;
    }
    #chartStatus.visible { display: flex; }

    .status-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--text-secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg { color: var(--text-secondary); font-size: 14px; }
    .status-msg.error { color: #f87171; }
    .status-hint { color: var(--text-secondary); font-size: 12px; max-width: 480px; line-height: 1.6; }
    .status-hint code { background: var(--bg-input); padding: 1px 5px; border-radius: 3px; color: #d1d5db; }

    /* ── Long Position Tool ─────────────────────────── */
    .tool-btn {
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .tool-btn:hover { background: #242424; color: var(--text-primary); }
    .tool-btn.active { background: #2a2a2a; color: #ffffff; border-color: #3a3a3a; }

    #longPosPanel {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    #longPosPanel.visible { display: flex; }
    #longPosShares {
      background: var(--bg-input);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 12px;
      font-family: inherit;
      padding: 3px 7px;
      width: 72px;
      text-align: right;
    }
    #longPosShares:focus { outline: none; border-color: var(--glass-border); }
    #longPosRR { color: #d1d5db; font-weight: 500; }
    .lp-clear {
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }
    .lp-clear:hover { color: var(--text-primary); border-color: var(--glass-border); }

    .chart-tf-label {
      position: absolute;
      bottom: 28px;
      right: 50px;
      z-index: 10;
      background: rgba(20,20,20,0.75);
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      color: #6b7280;
      pointer-events: none;
    }
  </style>
</head>
<body>
<script src="nav.js"></script>
<script>
  (function(){
    if (window.self !== window.top) return; // always embedded in a chart popup — no nav, no margin
    var s = document.createElement('style');
    s.textContent = 'body{margin-left:200px!important;margin-right:0!important;transition:none!important;}';
    document.head.appendChild(s);
  })();
</script>

<div class="page-hdr">
<div class="page-header">
  <div class="page-title" id="pageTitle">Candlestick Chart</div>
  <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
    <div style="display:flex;gap:6px;">
      <button class="nav-btn disabled" id="btnPrev" title="Previous trading day">&#8592;</button>
      <button class="nav-btn disabled" id="btnNext" title="Next trading day">&#8594;</button>
    </div>
  </div>
</div>

<div class="sym-pills" id="symPills"></div>
</div>

<div class="charts-wrap">
<div style="height:16px;"></div>

<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
  <div class="tf-selector" id="tfSelector" style="margin-bottom:0">
    <button class="tf-btn active" data-tf="1">1m</button>
    <button class="tf-btn" data-tf="2">2m</button>
    <button class="tf-btn" data-tf="5">5m</button>
    <button class="tf-btn" data-tf="15">15m</button>
  </div>
  <div style="width:1px;height:22px;background:var(--glass-border);flex-shrink:0;"></div>
  <button class="tool-btn" id="btnLongPos" onclick="toggleLongPosTool()" title="Long Position (Esc to cancel)">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
      <line x1="1" y1="10" x2="13" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="10" x2="4" y2="3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="10" y1="10" x2="10" y2="6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="4" cy="3.5" r="1.5" fill="currentColor"/>
      <circle cx="10" cy="6.5" r="1.5" fill="currentColor"/>
    </svg>
    Long position
  </button>
  <div style="width:1px;height:22px;background:var(--glass-border);flex-shrink:0;"></div>
  <button class="tool-btn" id="btnRuler" onclick="toggleRulerTool()" title="Ruler — measure price &amp; time (Esc to cancel)">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
      <line x1="2" y1="12" x2="12" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="12" x2="5.5" y2="12" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <line x1="12" y1="2" x2="12" y2="5.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    </svg>
    Ruler
  </button>
  <div style="width:1px;height:22px;background:var(--glass-border);flex-shrink:0;"></div>
  <div class="toggle-wrap" id="btnRealTrades" onclick="toggleExecMarkers()">
    <div class="toggle-track on" id="realTradesToggleTrack"><div class="toggle-thumb"></div></div>
    <span id="realTradesToggleLabel">Real trades</span>
  </div>
</div>
<div id="longPosPanel">
  <span style="color:#6b7280">Qty</span>
  <input type="number" id="longPosShares" value="100" min="1" step="1">
  <span id="longPosRR"></span>
  <button class="lp-clear" onclick="clearLongPosTool()">✕ Clear</button>
</div>

<div class="chart-legend" id="chartLegend" style="display:none">
  <span class="legend-item"><span class="legend-dot" style="background:rgb(34,197,94);border-radius:2px;transform:rotate(45deg)"></span> Entry</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(59,130,246);border-radius:2px;transform:rotate(45deg)"></span> Partial exit</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(249,115,22);border-radius:2px;transform:rotate(45deg)"></span> Exit (win)</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(239,68,68);border-radius:2px;transform:rotate(45deg)"></span> Exit (loss)</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(76,29,149);border-radius:2px;transform:rotate(45deg)"></span> Roth entry</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(196,181,253);border-radius:2px;transform:rotate(45deg)"></span> Roth exit</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(34,197,94)"></span> Paper entry</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(59,130,246)"></span> Paper partial exit</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(249,115,22)"></span> Paper exit (win)</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(239,68,68)"></span> Paper exit (loss)</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(156,163,175)"></span> Carried over from prior day</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(22,26,52);border:1px solid #2e3248"></span> Pre-market</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(22,26,52);border:1px solid #2e3248"></span> After-hours</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(128,255,255)"></span> 9 EMA</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(0,128,255)"></span> 20 EMA</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(220,50,50)"></span> 200 EMA</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(246,197,72)"></span> VWAP</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(33,150,243)"></span> MACD (9,12,9)</span>
  <span class="legend-item"><span class="legend-dot" style="background:rgb(255,152,0)"></span> Signal (9)</span>
</div>

<div class="chart-outer" id="chartOuter">
  <div id="chartStatus" class="visible">
    <div class="status-spinner"></div>
    <div class="status-msg">Loading…</div>
  </div>
  <div id="chartInner">
    <div id="chartMain"></div>
  </div>
  <div id="hoverTooltip"></div>
  <button id="btnFullscreen" title="Toggle fullscreen (F)">
    <svg id="fsIconExpand" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg>
    <svg id="fsIconCollapse" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none"><path d="M5 1v4H1M9 5V1h4M9 13v-4h4M1 9h4v4"/></svg>
  </button>
  <span class="chart-tf-label" id="leftTfLabel">2m</span>
</div>
<div id="dotTooltip"></div>
</div><!-- /.charts-wrap -->

<script>
  const MONTHS = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];
  const DAYS_OF_WEEK = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];


  let curYear, curMonth, curDay;
  let chartInstance   = null;
  let candleSeriesRef = null;
  let markerCleanup   = null;
  let execMarkersOn   = true;
  let activeSymbol    = null;
  let activeInterval  = 1;      // current timeframe in minutes
  let rawCandles      = null;   // 1m candles for active symbol
  let activeExecs       = [];     // executions for active symbol
  let ohlcvCache        = {};     // loaded from ohlcv_YYYY-MM-DD.json
  let tradingDays       = [];     // sorted list of {year,month,day} objects with trade data
  let activeTrades      = [];     // activeExecs grouped by round-trip
  let pendingTradeZoom  = null;   // { entryTime, exitTime } from a trades.html deep link — consumed on first render
  let longPosMode  = false;       // long position tool toggled on
  let longPositions = [];         // array of { entry, target, stop, t0, t1 }
  let lpSvg        = null;        // SVG overlay element
  let lpSubCleanup = null;        // fn to unsubscribe chart events

  let rulerMode    = false;       // ruler tool active
  // rulers = array of locked { t0, p0, t1, p1 }; activeRuler = in-progress ruler (t1/p1 null = preview phase)
  const rulerState = { rulers: [], activeRuler: null, svg: null, subCleanup: null, liveX: 0, liveY: 0 };
  let activeBars   = null;        // aggregated bars at current timeframe (for snap)

  let allSymbolExecs  = [];       // all execs for current symbol

  function displayExecs() { return activeExecs; }

  // Redraws markers in place from the current activeExecs — does not
  // touch nav, pills, or which real trade day/symbol is being viewed.
  function redrawExecMarkers() {
    if (!rawCandles || !chartInstance || !candleSeriesRef) return;
    if (markerCleanup) { markerCleanup(); markerCleanup = null; }
    const execs = displayExecs();
    const label = document.getElementById('realTradesToggleLabel');
    if (label) label.textContent = `Real trades${execs.length ? ` (${execs.length})` : ''}`;
    const timeMap     = buildTimeMap(rawCandles);
