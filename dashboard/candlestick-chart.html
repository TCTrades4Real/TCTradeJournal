    if (execMarkersOn) {
      markerCleanup = renderExecMarkers(execs, timeMap, barsTimeMap, {
        chartInst: chartInstance, seriesRef: candleSeriesRef,
        containerId: 'chartMain', dotTipEl,
      });
    }
  }

  function toggleExecMarkers() {
    execMarkersOn = !execMarkersOn;
    document.getElementById('realTradesToggleTrack').classList.toggle('on', execMarkersOn);
    redrawExecMarkers();
  }

  // Pane size state (persists across timeframe changes and page reloads)
  function loadPaneState(key, def) {
    try { const s = JSON.parse(localStorage.getItem(key)); if (s && s.topFrac && s.botFrac) return s; } catch(_) {}
    return { ...def };
  }
  const paneState1 = loadPaneState('tc_pane1', { topFrac: 0.63, botFrac: 0.80 });

  /* ── Formatters ──────────────────────────────────── */
  function ordinal(n) {
    const s = ['th','st','nd','rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function fmtDollars(abs) {
    return abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtPnl(pnl) {
    const sign = pnl < 0 ? '-' : pnl > 0 ? '+' : '';
    return `${sign}$${fmtDollars(Math.abs(pnl))}`;
  }

  /* ── Status helpers ──────────────────────────────── */
  function showLoading(msg = 'Fetching chart data…') {
    const el = document.getElementById('chartStatus');
    el.innerHTML = `<div class="status-spinner"></div><div class="status-msg">${msg}</div>`;
    el.className = 'visible';
  }
  function showError(msg, hint = '') {
    const el = document.getElementById('chartStatus');
    el.innerHTML = `
      <div class="status-msg error">${msg}</div>
      ${hint ? `<div class="status-hint">${hint}</div>` : ''}`;
    el.className = 'visible';
  }
  function hideStatus() {
    document.getElementById('chartStatus').className = '';
  }

  /* ── Time helpers ────────────────────────────────── */
  // Convert Unix timestamp → "HH:MM" in ET
  function tsToET(ts) {
    return new Date(ts * 1000).toLocaleTimeString('en-US', {
      timeZone: 'America/New_York',
      hour: '2-digit', minute: '2-digit', hour12: false,
    });
  }

  // Build map: "HH:MM" ET → first Unix timestamp for that minute
  function buildTimeMap(candles) {
    const map = {};
    for (const c of candles) {
      const et = tsToET(c.time);
      if (!(et in map)) map[et] = c.time;
    }
    return map;
  }

  // Convert execution time string "HH:MM:SS" → candle timestamp.
  // Floors to the nearest candle that started at or before the execution time.
  function execToTimestamp(timeStr, timeMap) {
    const [hh, mm] = timeStr.slice(0, 5).split(':').map(Number);
    const execMins = hh * 60 + mm;
    let best = null, bestMins = -1;
    for (const key of Object.keys(timeMap)) {
      const [kh, km] = key.split(':').map(Number);
      const kMins = kh * 60 + km;
      if (kMins <= execMins && kMins > bestMins) { bestMins = kMins; best = timeMap[key]; }
    }
    return best;
  }

  // Snap a raw Unix timestamp to the nearest bar at or before it in the sorted bars array.
  // More reliable than string-based floor search when the trail TF differs from the view TF.
  function snapTsToBar(ts, bars) {
    if (!bars?.length || !ts) return null;
    let lo = 0, hi = bars.length - 1, result = null;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (bars[mid].time <= ts) { result = bars[mid].time; lo = mid + 1; }
      else hi = mid - 1;
    }
    return result;
  }

  // Aggregate 1-minute candles into N-minute bars
  function aggregateCandles(candles, intervalMins) {
    if (intervalMins === 1) return candles;
    const buckets = new Map();
    for (const c of candles) {
      const et = tsToET(c.time);
      const [h, m] = et.split(':').map(Number);
      const snapped = Math.floor((h * 60 + m) / intervalMins) * intervalMins;
      const key = `${String(Math.floor(snapped / 60)).padStart(2,'0')}:${String(snapped % 60).padStart(2,'0')}`;
      if (!buckets.has(key)) {
        buckets.set(key, { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close, volume: c.volume });
      } else {
        const b = buckets.get(key);
        b.high    = Math.max(b.high, c.high);
        b.low     = Math.min(b.low, c.low);
        b.close   = c.close;
        b.volume += c.volume;
      }
    }
    return Array.from(buckets.values());
  }

  /* ── Trade grouping ─────────────────────────────── */
  // Groups a flat list of executions into round-trips (position 0→n→0 cycles).
  function groupExecutionsIntoTrades(execs) {
    // Round-trips are per (symbol, account) — execs here are already filtered to one
    // symbol, but two different accounts holding the same symbol the same day (e.g. a
    // real trade and a paper trade in the same ticker) are financially unrelated
    // positions. Merging their fills into one chronological position-walk corrupts it —
    // the walk may never return to zero, so the trade never registers as closed and no
    // exit marker gets drawn. Bucket by account first, then walk each bucket separately.
    const byAccount = new Map();
    for (const ex of execs) {
      const key = ex.account || '';
      if (!byAccount.has(key)) byAccount.set(key, []);
      byAccount.get(key).push(ex);
    }

    const groups = [];
    for (const acctExecs of byAccount.values()) {
      // A day's first fill for a symbol being a sell means it's closing a position that
      // was opened on a PRIOR day (calendar_data.py buckets fills per calendar day, so
      // the real entry fill lives in yesterday's data, not here) — there's no valid
      // entry price for it within today alone. Rather than let the position walk below
      // start negative and drag everything that follows into one ambiguous "carryover"
      // blob, split it into its own single-fill group (still rendered as the usual
      // neutral "carryover" marker below, via the existing trade[0].pos_effect ===
      // 'TO CLOSE' check) instead — a fresh, fully-within-today round-trip right after
      // it then renders normally on its own.
      let rest = acctExecs;
      if (rest.length && rest[0].side === 'sell') {
        groups.push([rest[0]]);
        rest = rest.slice(1);
      }

      let current = [], position = 0;
      for (const ex of rest) {
        current.push(ex);
        position += ex.side === 'buy' ? ex.qty : -ex.qty;
        if (Math.abs(position) < 0.001) {
          groups.push(current);
          current = [];
          position = 0;
        }
      }
      if (current.length > 0) groups.push(current); // open/partial trade
    }
    return groups;
  }

  /* ── Long Position Tool ──────────────────────────── */
  function getLpShares() {
    return Math.max(1, parseInt(document.getElementById('longPosShares')?.value || '100', 10) || 100);
  }

  function clearLongPosTool() {
    longPositions = [];
    if (lpSubCleanup) { lpSubCleanup(); lpSubCleanup = null; }
    if (lpSvg)        { lpSvg.remove(); lpSvg = null; }
    document.getElementById('longPosPanel')?.classList.remove('visible');
  }

  function toggleLongPosTool() {
    longPosMode = !longPosMode;
    document.getElementById('btnLongPos').classList.toggle('active', longPosMode);
    const chartMain = document.getElementById('chartMain');
    if (longPosMode) {
      chartMain.style.cursor = 'crosshair';
      chartMain.title = 'Click to place entry price';
    } else {
      chartMain.style.cursor = '';
      chartMain.title = '';
      clearLongPosTool();
    }
  }

  function updateLpInfo() {
    if (!longPositions.length) return;
    const pos = longPositions[longPositions.length - 1];
    const profitPct = ((pos.target - pos.entry) / pos.entry * 100).toFixed(2);
    const lossPct   = ((pos.entry  - pos.stop)  / pos.entry * 100).toFixed(2);
    const rr = parseFloat(lossPct) > 0
      ? (parseFloat(profitPct) / parseFloat(lossPct)).toFixed(2) : '∞';
    const el = document.getElementById('longPosRR');
    if (el) el.textContent = `R:R ${rr}  (+${profitPct}% / −${lossPct}%)`;
  }

  function renderLongPosOverlay() {
    if (!longPositions.length || !chartInstance || !candleSeriesRef) return;

    const container = document.getElementById('chartMain');
    container.style.position = 'relative';

    if (lpSubCleanup) { lpSubCleanup(); lpSubCleanup = null; }
    if (lpSvg)        { lpSvg.remove(); lpSvg = null; }

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'lpOverlay';
    svg.setAttribute('style',
      'position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:6;pointer-events:none;');
    container.appendChild(svg);
    lpSvg = svg;

    function draw() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      if (!chartInstance || !candleSeriesRef || !longPositions.length) return;
      for (const pos of longPositions) drawPos(pos);
    }

    function drawPos(pos) {
      const W      = container.offsetWidth;
      const PSCALE = 72;
      const CW     = W - PSCALE;
      const shares = getLpShares();
      const timeScale = chartInstance.timeScale();

      let lineX0 = timeScale.timeToCoordinate(pos.t0);
      let lineX1 = timeScale.timeToCoordinate(pos.t1);
      if (lineX0 == null) lineX0 = 0;
      if (lineX1 == null) lineX1 = CW;
      const lineW = lineX1 - lineX0;

      const yEntry  = candleSeriesRef.priceToCoordinate(pos.entry);
      const yTarget = candleSeriesRef.priceToCoordinate(pos.target);
      const yStop   = candleSeriesRef.priceToCoordinate(pos.stop);
      if (yEntry == null || yTarget == null || yStop == null) return;

      const profitAmt = (pos.target - pos.entry) * shares;
      const lossAmt   = (pos.entry  - pos.stop)  * shares;
      const profitPct = (pos.target - pos.entry) / pos.entry * 100;
      const lossPct   = (pos.entry  - pos.stop)  / pos.entry * 100;
      const rr        = lossPct > 0 ? (profitPct / lossPct).toFixed(2) : '∞';
      const fmtP      = v => Math.abs(v) < 10 ? v.toFixed(4) : v.toFixed(2);
      const fmtD      = v => v.toFixed(2);

      let outcome = null;
      if (rawCandles?.length) {
        for (const c of rawCandles) {
          if (c.time < pos.t0) continue;
          if (c.high >= pos.target) { outcome = 'target'; break; }
          if (c.low  <= pos.stop)   { outcome = 'stop';   break; }
        }
      }

      function fillZone(y1, y2, fill) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        el.setAttribute('x', lineX0); el.setAttribute('y', Math.min(y1, y2));
        el.setAttribute('width', lineW); el.setAttribute('height', Math.abs(y2 - y1));
        el.setAttribute('fill', fill);
        svg.appendChild(el);
      }
      fillZone(yEntry, yTarget, 'rgba(8,153,129,0.18)');
      fillZone(yStop,  yEntry,  'rgba(242,54,69,0.18)');

      function hLine(y, color, dash) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        el.setAttribute('x1', lineX0); el.setAttribute('y1', y);
        el.setAttribute('x2', lineX1); el.setAttribute('y2', y);
        el.setAttribute('stroke', color); el.setAttribute('stroke-width', 1.5);
        if (dash) el.setAttribute('stroke-dasharray', dash);
        svg.appendChild(el);
      }
      hLine(yTarget, 'rgb(8,153,129)');
      hLine(yEntry,  '#6b7280', '5,3');
      hLine(yStop,   'rgb(242,54,69)');

      // ── Move area ─────────────────────────────────── //
      const moveArea = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      moveArea.setAttribute('x', lineX0);
      moveArea.setAttribute('y', Math.min(yTarget, yStop));
      moveArea.setAttribute('width', lineW);
      moveArea.setAttribute('height', Math.abs(yTarget - yStop));
      moveArea.setAttribute('fill', 'transparent');
      moveArea.style.pointerEvents = 'all';
      moveArea.style.cursor = 'move';
      moveArea.addEventListener('mousedown', ev => {
        if (ev.button !== 0) return;
        ev.preventDefault(); ev.stopPropagation();
        const cap = document.createElement('div');
        cap.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:move;';
        document.body.appendChild(cap);
        const startClientX = ev.clientX;
        const startClientY = ev.clientY;
        const snapEntry = pos.entry, snapTarget = pos.target, snapStop = pos.stop;
        const snapT0 = pos.t0, snapT1 = pos.t1;
        const bRect0 = container.getBoundingClientRect();
        const startPrice = candleSeriesRef.coordinateToPrice(startClientY - bRect0.top);
        function onMove(mv) {
          const bRect = container.getBoundingClientRect();
          const curPrice = candleSeriesRef.coordinateToPrice(mv.clientY - bRect.top);
          if (startPrice != null && curPrice != null) {
            const dp = curPrice - startPrice;
            pos.entry = snapEntry + dp; pos.target = snapTarget + dp; pos.stop = snapStop + dp;
          }
          const dx = mv.clientX - startClientX;
          const snapX0 = timeScale.timeToCoordinate(snapT0);
          const snapX1 = timeScale.timeToCoordinate(snapT1);
          if (snapX0 != null && snapX1 != null) {
            pos.t0 = timeScale.coordinateToTime(snapX0 + dx) ?? pos.t0;
            pos.t1 = timeScale.coordinateToTime(snapX1 + dx) ?? pos.t1;
          }
          draw(); updateLpInfo();
        }
        function onUp() { cap.remove(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
      svg.appendChild(moveArea);

      // ── Delete (✕) button top-right of move area ─── //
      const delX = lineX1 - 10, delY = Math.min(yTarget, yStop) + 10;
      const delBtn = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      delBtn.style.pointerEvents = 'all';
      delBtn.style.cursor = 'pointer';
      const delBg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      delBg.setAttribute('cx', delX); delBg.setAttribute('cy', delY);
      delBg.setAttribute('r', 7); delBg.setAttribute('fill', 'rgba(30,30,30,0.85)');
      delBg.setAttribute('stroke', '#555'); delBg.setAttribute('stroke-width', 1);
      const delTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      delTxt.setAttribute('x', delX); delTxt.setAttribute('y', delY + 4);
      delTxt.setAttribute('text-anchor', 'middle'); delTxt.setAttribute('fill', '#9ca3af');
      delTxt.setAttribute('font-size', 10); delTxt.setAttribute('font-family', 'Inter,sans-serif');
      delTxt.textContent = '✕';
      delBtn.appendChild(delBg); delBtn.appendChild(delTxt);
      delBtn.addEventListener('mousedown', ev => { ev.preventDefault(); ev.stopPropagation(); });
      delBtn.addEventListener('click', ev => {
        ev.stopPropagation();
        const idx = longPositions.indexOf(pos);
        if (idx !== -1) longPositions.splice(idx, 1);
        if (!longPositions.length) { clearLongPosTool(); } else { draw(); updateLpInfo(); }
      });
      svg.appendChild(delBtn);

      // ── Line labels ───────────────────────────────── //
      function lineLabel(y, bgColor, text) {
        const FH = 11, PX = 7, PY = 4;
        const BH = FH + PY * 2;
        const BW = Math.min(text.length * 6.1 + PX * 2, lineW - 8);
        if (BW < 20) return;
        const BX = lineX0 + 4, BY = y - BH / 2;
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('x', BX); bg.setAttribute('y', BY);
        bg.setAttribute('width', BW); bg.setAttribute('height', BH);
        bg.setAttribute('rx', 3); bg.setAttribute('fill', bgColor);
        svg.appendChild(bg);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', BX + PX); t.setAttribute('y', BY + PY + FH - 1);
        t.setAttribute('fill', '#fff'); t.setAttribute('font-size', FH);
        t.setAttribute('font-family', 'Inter,-apple-system,sans-serif');
        t.setAttribute('font-weight', '500');
        t.textContent = text;
        svg.appendChild(t);
      }
      lineLabel(yTarget, 'rgba(8,153,129,0.95)',
        `${fmtP(pos.target)}  (+${profitPct.toFixed(3)}%)  ${shares}  +$${fmtD(profitAmt)}`);
      lineLabel(yEntry,  'rgba(30,41,59,0.95)',
        `${fmtP(pos.entry)}  ×${shares} shares`);
      lineLabel(yStop,   'rgba(140,31,31,0.95)',
        `${fmtP(pos.stop)}  (${lossPct.toFixed(3)}%)  ${shares}  −$${fmtD(lossAmt)}`);

      // ── Centre badge ──────────────────────────────── //
      const lossH = Math.abs(yEntry - yStop);
      if (lossH > 30 && lineW > 80) {
        const midY = (yEntry + yStop) / 2;
        const txt  = `−$${fmtD(lossAmt)}  ~  ${shares}  R:R ${rr}`;
        const FH = 11, PX = 9, PY = 5;
        const BW = Math.min(txt.length * 6.1 + PX * 2, lineW - 16);
        const BH = FH + PY * 2;
        const BX = lineX0 + lineW / 2 - BW / 2;
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('x', BX); bg.setAttribute('y', midY - BH / 2);
        bg.setAttribute('width', BW); bg.setAttribute('height', BH);
        const badgeFill = outcome === 'target' ? 'rgba(8,153,129,0.90)'
                        : outcome === 'stop'   ? 'rgba(140,31,31,0.90)'
                        : 'rgba(55,65,81,0.85)';
        bg.setAttribute('rx', 4); bg.setAttribute('fill', badgeFill);
        svg.appendChild(bg);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', BX + PX); t.setAttribute('y', midY + FH / 2 - 1);
        t.setAttribute('fill', '#fff'); t.setAttribute('font-size', FH);
        t.setAttribute('font-family', 'Inter,-apple-system,sans-serif');
        t.setAttribute('font-weight', '600');
        t.textContent = txt;
        svg.appendChild(t);
      }

      // ── Corner handles ────────────────────────────── //
      function square(x, y, xEdge) {
        const SZ = 8;
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        el.setAttribute('x', x - SZ / 2); el.setAttribute('y', y - SZ / 2);
        el.setAttribute('width', SZ); el.setAttribute('height', SZ);
        el.setAttribute('fill', '#1d4ed8');
        el.setAttribute('stroke', '#93c5fd'); el.setAttribute('stroke-width', 1);
        el.style.pointerEvents = 'all';
        el.style.cursor = 'ew-resize';
        el.addEventListener('mousedown', ev => {
          if (ev.button !== 0) return;
          ev.preventDefault(); ev.stopPropagation();
          const cap = document.createElement('div');
          cap.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:ew-resize;';
          document.body.appendChild(cap);
          function onMove(mv) {
            const bRect = container.getBoundingClientRect();
            const t = timeScale.coordinateToTime(mv.clientX - bRect.left);
            if (t == null) return;
            if (xEdge === 'left') { if (t !== pos.t1) pos.t0 = t; }
            else                  { if (t !== pos.t0) pos.t1 = t; }
            draw();
          }
          function onUp() { cap.remove(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        svg.appendChild(el);
      }
      square(lineX0, yTarget, 'left');  square(lineX1, yTarget, 'right');
      square(lineX0, yEntry,  'left');  square(lineX1, yEntry,  'right');
      square(lineX0, yStop,   'left');  square(lineX1, yStop,   'right');

      // ── Price drag strips ─────────────────────────── //
      function dragHandle(y, role) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        el.setAttribute('x', lineX0 + 10); el.setAttribute('y', y - 7);
        el.setAttribute('width', Math.max(0, lineW - 20)); el.setAttribute('height', 14);
        el.setAttribute('fill', 'transparent');
        el.style.pointerEvents = 'all';
        el.style.cursor = 'ns-resize';
        el.addEventListener('mousedown', ev => {
          if (ev.button !== 0) return;
          ev.preventDefault(); ev.stopPropagation();
          const cap = document.createElement('div');
          cap.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:ns-resize;';
          document.body.appendChild(cap);
          function onMove(mv) {
            const bRect = container.getBoundingClientRect();
            const p = candleSeriesRef.coordinateToPrice(mv.clientY - bRect.top);
            if (p == null) return;
            if (role === 'target')     { pos.target = Math.max(p, pos.entry + 0.005); }
            else if (role === 'stop')  { pos.stop   = Math.min(p, pos.entry - 0.005); }
            else { const d = p - pos.entry; pos.entry += d; pos.target += d; pos.stop += d; }
            draw(); updateLpInfo();
          }
          function onUp() { cap.remove(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        svg.appendChild(el);
      }
      dragHandle(yTarget, 'target');
      dragHandle(yEntry,  'entry');
      dragHandle(yStop,   'stop');
    }

    draw();
    chartInstance.timeScale().subscribeVisibleLogicalRangeChange(draw);
    try { chartInstance.priceScale('right').subscribeVisiblePriceRangeChange(draw); } catch (_) {}
    lpSubCleanup = () => {
      try { chartInstance.timeScale().unsubscribeVisibleLogicalRangeChange(draw); } catch (_) {}
      try { chartInstance.priceScale('right').unsubscribeVisiblePriceRangeChange(draw); } catch (_) {}
    };
  }

  /* ── Ruler snap helper ───────────────────────────── */
  // Returns { x, y, price, time } of nearest candle high/low within SNAP_PX,
  // or null if nothing is close enough.
  function snapToCandle(px, py) {
    if (!activeBars?.length || !chartInstance || !candleSeriesRef) return null;
    const SNAP_PX = 14;
    const timeScale = chartInstance.timeScale();
    let bestDist = SNAP_PX;
    let result = null;
    for (const bar of activeBars) {
      const bx = timeScale.timeToCoordinate(bar.time);
      if (bx == null || Math.abs(bx - px) > SNAP_PX * 2) continue;
      for (const [price] of [[bar.high], [bar.low]]) {
        const by = candleSeriesRef.priceToCoordinate(price);
        if (by == null) continue;
        const dist = Math.hypot(bx - px, by - py);
        if (dist < bestDist) {
          bestDist = dist;
          result = { x: bx, y: by, price, time: bar.time };
        }
      }
    }
    return result;
  }

  /* ── Ruler Tool ─────────────────────────────────── */
  function clearRulerTool() {
    rulerState.rulers = []; rulerState.activeRuler = null;
    if (rulerState.subCleanup) { rulerState.subCleanup(); rulerState.subCleanup = null; }
    if (rulerState.svg)        { rulerState.svg.remove(); rulerState.svg = null; }
  }

  function toggleRulerTool() {
    rulerMode = !rulerMode;
    document.getElementById('btnRuler').classList.toggle('active', rulerMode);
    const chartMain = document.getElementById('chartMain');
    if (rulerMode) {
      chartMain.style.cursor = 'crosshair';
    } else {
      chartMain.style.cursor = '';
      clearRulerTool();
    }
  }

  function renderRulerOverlay() {
    const ctx = { chartInst: chartInstance, seriesRef: candleSeriesRef, containerId: 'chartMain' };
    const st  = rulerState;
    if ((!st.rulers.length && !st.activeRuler) || !ctx.chartInst || !ctx.seriesRef) return;

    const container = document.getElementById(ctx.containerId);
    container.style.position = 'relative';

    if (!st.svg) {
      if (st.subCleanup) { st.subCleanup(); st.subCleanup = null; }
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.id = 'rulerOverlay';
      svg.setAttribute('style',
        'position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:7;pointer-events:none;');
      container.appendChild(svg);
      st.svg = svg;
      ctx.chartInst.timeScale().subscribeVisibleLogicalRangeChange(draw);
      try { ctx.chartInst.priceScale('right').subscribeVisiblePriceRangeChange(draw); } catch (_) {}
      st.subCleanup = () => {
        try { ctx.chartInst.timeScale().unsubscribeVisibleLogicalRangeChange(draw); } catch (_) {}
        try { ctx.chartInst.priceScale('right').unsubscribeVisiblePriceRangeChange(draw); } catch (_) {}
      };
    }

    function draw() {
      const svg = st.svg;
      if (!svg || !ctx.chartInst || !ctx.seriesRef) return;
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      for (const r of st.rulers) drawRuler(r, true, svg);
      if (st.activeRuler) drawRuler(st.activeRuler, false, svg);
    }

    function drawRuler(r, locked, svg) {
      const timeScale = ctx.chartInst.timeScale();
      const x0 = timeScale.timeToCoordinate(r.t0);
      const y0 = ctx.seriesRef.priceToCoordinate(r.p0);
      if (x0 == null || y0 == null) return;

      let x1, y1, p1, t1;
      if (locked) {
        x1 = timeScale.timeToCoordinate(r.t1);
        y1 = ctx.seriesRef.priceToCoordinate(r.p1);
        p1 = r.p1; t1 = r.t1;
      } else {
        x1 = st.liveX; y1 = st.liveY;
        t1 = timeScale.coordinateToTime(x1) ?? r.t0;
        p1 = ctx.seriesRef.coordinateToPrice(y1) ?? r.p0;
      }
      if (x1 == null || y1 == null) return;

      const priceDelta = p1 - r.p0;
      const pctDelta   = (priceDelta / r.p0) * 100;
      const sign       = priceDelta >= 0 ? '+' : '';
      const lineColor  = priceDelta >= 0 ? 'rgb(8,153,129)' : 'rgb(242,54,69)';
      const fillColor  = priceDelta >= 0 ? 'rgba(8,153,129,0.10)' : 'rgba(242,54,69,0.10)';

      const tMin = Math.min(r.t0, t1), tMax = Math.max(r.t0, t1);
      let barCount = 0;
      for (const c of (rawCandles || [])) { if (c.time >= tMin && c.time <= tMax) barCount++; }
      const timeMins = Math.round(Math.abs(t1 - r.t0) / 60);

      const rectEl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rectEl.setAttribute('x', Math.min(x0, x1)); rectEl.setAttribute('y', Math.min(y0, y1));
      rectEl.setAttribute('width', Math.abs(x1 - x0)); rectEl.setAttribute('height', Math.abs(y1 - y0));
      rectEl.setAttribute('fill', fillColor);
      if (locked) { rectEl.style.pointerEvents = 'all'; rectEl.style.cursor = 'move'; }
      svg.appendChild(rectEl);

      const hLeg = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      hLeg.setAttribute('x1', x0); hLeg.setAttribute('y1', y1);
      hLeg.setAttribute('x2', x1); hLeg.setAttribute('y2', y1);
      hLeg.setAttribute('stroke', '#4b5563'); hLeg.setAttribute('stroke-width', 1);
      hLeg.setAttribute('stroke-dasharray', '4,3'); svg.appendChild(hLeg);

      const vLeg = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      vLeg.setAttribute('x1', x1); vLeg.setAttribute('y1', y0);
      vLeg.setAttribute('x2', x1); vLeg.setAttribute('y2', y1);
      vLeg.setAttribute('stroke', '#4b5563'); vLeg.setAttribute('stroke-width', 1);
      vLeg.setAttribute('stroke-dasharray', '4,3'); svg.appendChild(vLeg);

      const diagLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      diagLine.setAttribute('x1', x0); diagLine.setAttribute('y1', y0);
      diagLine.setAttribute('x2', x1); diagLine.setAttribute('y2', y1);
      diagLine.setAttribute('stroke', lineColor); diagLine.setAttribute('stroke-width', 1.5);
      svg.appendChild(diagLine);

      const midX = (x0 + x1) / 2, midY = (y0 + y1) / 2;
      const absPriceFmt = Math.abs(priceDelta) < 10 ? Math.abs(priceDelta).toFixed(4) : Math.abs(priceDelta).toFixed(2);
      const label = `${sign}$${absPriceFmt}  ${sign}${pctDelta.toFixed(2)}%  ${barCount} bars  ${timeMins}m`;
      const FH = 11, PX = 8, PY = 4;
      const BW = label.length * 6.1 + PX * 2, BH = FH + PY * 2;
      const badgeFill = priceDelta >= 0 ? 'rgba(8,153,129,0.92)' : 'rgba(140,31,31,0.92)';
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', midX - BW / 2); bg.setAttribute('y', midY - BH / 2);
      bg.setAttribute('width', BW); bg.setAttribute('height', BH);
      bg.setAttribute('rx', 4); bg.setAttribute('fill', badgeFill); svg.appendChild(bg);
      const labelEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      labelEl.setAttribute('x', midX - BW / 2 + PX); labelEl.setAttribute('y', midY + FH / 2 - 1);
      labelEl.setAttribute('fill', '#fff'); labelEl.setAttribute('font-size', FH);
      labelEl.setAttribute('font-family', 'Inter,-apple-system,sans-serif');
      labelEl.setAttribute('font-weight', '600'); labelEl.textContent = label;
      svg.appendChild(labelEl);

      if (!locked) {
        const snapHit = snapToCandle(st.liveX, st.liveY);
        if (snapHit) {
          const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          ring.setAttribute('cx', x1); ring.setAttribute('cy', y1); ring.setAttribute('r', 8);
          ring.setAttribute('fill', 'none');
          ring.setAttribute('stroke', '#fbbf24'); ring.setAttribute('stroke-width', 1.5);
          svg.appendChild(ring);
        }
        return;
      }

      // Delete button
      const delX = Math.max(x0, x1) - 10, delY = Math.min(y0, y1) + 10;
      const delG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      delG.style.pointerEvents = 'all'; delG.style.cursor = 'pointer';
      const delBg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      delBg.setAttribute('cx', delX); delBg.setAttribute('cy', delY);
      delBg.setAttribute('r', 7); delBg.setAttribute('fill', 'rgba(30,30,30,0.85)');
      delBg.setAttribute('stroke', '#555'); delBg.setAttribute('stroke-width', 1);
      const delTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      delTxt.setAttribute('x', delX); delTxt.setAttribute('y', delY + 4);
      delTxt.setAttribute('text-anchor', 'middle'); delTxt.setAttribute('fill', '#9ca3af');
      delTxt.setAttribute('font-size', 10); delTxt.setAttribute('font-family', 'Inter,sans-serif');
      delTxt.textContent = '✕'; delG.appendChild(delBg); delG.appendChild(delTxt);
      delG.addEventListener('mousedown', ev => { ev.preventDefault(); ev.stopPropagation(); });
      delG.addEventListener('click', ev => {
        ev.stopPropagation();
        const idx = st.rulers.indexOf(r);
        if (idx !== -1) st.rulers.splice(idx, 1);
        if (!st.rulers.length && !st.activeRuler) { clearRulerTool(); } else { draw(); }
      });
      svg.appendChild(delG);

      // Endpoint circles
      function endCircle(cx, cy, isFirst) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 5);
        c.setAttribute('fill', lineColor); c.setAttribute('stroke', '#ffffff'); c.setAttribute('stroke-width', 1.5);
        c.style.pointerEvents = 'all'; c.style.cursor = 'grab';
        c.addEventListener('mousedown', ev => {
          if (ev.button !== 0) return;
          ev.preventDefault(); ev.stopPropagation();
          const cap = document.createElement('div');
          cap.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:grabbing;';
          document.body.appendChild(cap);
          function onMove(mv) {
            const bRect = container.getBoundingClientRect();
            const px = mv.clientX - bRect.left, py = mv.clientY - bRect.top;
            const snap = snapToCandle(px, py);
            const t = snap ? snap.time : timeScale.coordinateToTime(px);
            const p = snap ? snap.price : ctx.seriesRef.coordinateToPrice(py);
            if (t == null || p == null) return;
            if (isFirst) { r.t0 = t; r.p0 = p; } else { r.t1 = t; r.p1 = p; }
            draw();
          }
          function onUp() { cap.remove(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
          document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
        });
        svg.appendChild(c);
      }
      endCircle(x0, y0, true); endCircle(x1, y1, false);

      // Move rect drag
      rectEl.addEventListener('mousedown', ev => {
        if (ev.button !== 0) return;
        ev.preventDefault(); ev.stopPropagation();
        const cap = document.createElement('div');
        cap.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:move;';
        document.body.appendChild(cap);
        const bRect0 = container.getBoundingClientRect();
        const startPrice = ctx.seriesRef.coordinateToPrice(ev.clientY - bRect0.top);
        const startCX = ev.clientX;
        const snapT0 = r.t0, snapP0 = r.p0, snapT1 = r.t1, snapP1 = r.p1;
        function onMove(mv) {
          const bRect = container.getBoundingClientRect();
          const curPrice = ctx.seriesRef.coordinateToPrice(mv.clientY - bRect.top);
          if (startPrice != null && curPrice != null) { const dp = curPrice - startPrice; r.p0 = snapP0 + dp; r.p1 = snapP1 + dp; }
          const dx = mv.clientX - startCX;
          const sx0 = timeScale.timeToCoordinate(snapT0), sx1 = timeScale.timeToCoordinate(snapT1);
          if (sx0 != null && sx1 != null) {
            r.t0 = timeScale.coordinateToTime(sx0 + dx) ?? r.t0;
            r.t1 = timeScale.coordinateToTime(sx1 + dx) ?? r.t1;
          }
          draw();
        }
        function onUp() { cap.remove(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
      });
    }

    draw();
    st.svg._draw = draw;
  }

  /* ── SVG execution markers ───────────────────────── */
  // Returns a cleanup function. Caller is responsible for calling previous cleanup and storing the new one.
  // role: 'entry' (opening side of the round-trip), 'partial' (interim closing fill),
  // 'exit' (the fill that flattens the position), or 'carryover' (this day's view opens
  // with a 'TO CLOSE' fill — the real entry happened a prior day and isn't in this day's
  // data, so there's no valid P&L to color by). Carryover always wins over Roth-purple:
  // "we can't compute this" is more urgent to signal than which account it's in.
  function realTradeColor(role, tradePnl, isRoth) {
    if (role === 'carryover') return 'rgb(156,163,175)';
    if (isRoth) return role === 'entry' ? 'rgb(76,29,149)' : 'rgb(196,181,253)';
    if (role === 'entry')   return 'rgb(34,197,94)';
    if (role === 'partial') return 'rgb(59,130,246)';
    return tradePnl >= 0 ? 'rgb(249,115,22)' : 'rgb(239,68,68)';
  }

  function diamondPoints(x, y, r) {
    return `${x},${y - r} ${x + r},${y} ${x},${y + r} ${x - r},${y}`;
  }

  function renderExecMarkers(executions, timeMap, barsTimeMap, ctx) {
    const chartInst   = ctx?.chartInst   ?? chartInstance;
    const seriesRef   = ctx?.seriesRef   ?? candleSeriesRef;
    const containerId = ctx?.containerId ?? 'chartMain';
    const dotTipEl    = ctx?.dotTipEl    ?? document.getElementById('dotTooltip');
    const trades      = ctx?.trades      ?? activeTrades;

    if (!executions?.length || !chartInst || !seriesRef) return null;

    // Pre-resolve timestamps once.
    const posMap = barsTimeMap || timeMap;
    const resolved = [];
    for (const ex of executions) {
      const ts    = execToTimestamp(ex.time, timeMap);
      const tsBar = execToTimestamp(ex.time, posMap);
      if (ts == null || tsBar == null) continue;
      resolved.push({ ts, tsBar, price: ex.price, side: ex.side, account: ex.account || '' });
    }
    if (!resolved.length) return null;

    const container = document.getElementById(containerId);
    container.style.position = 'relative';

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('style',
      'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:5;');
    container.appendChild(svg);

    // Build map: exec key → { role, pnl } describing its part in the round-trip.
    // A round-trip's opening side (whichever side the group starts on) are entries;
    // the fill that flattens the position is the exit; anything else closing is a partial.
    // tradeLines: one dotted connector per closed round-trip, from its first entry
    // to its final exit.
    const execRole  = new Map();
    const tradeLines = [];
    for (const trade of trades) {
      if (!trade.length) continue;
      const openSide = trade[0].side;
      // A group whose first visible fill is 'TO CLOSE' didn't actually open here — the
      // real entry happened a prior day and isn't in this day's data (calendar_data.py
      // buckets executions per calendar day, so a cross-day round-trip's halves land in
      // two different days' JSON). Every fill in such a group is really an exit-side
      // fragment of that other trade; there's no valid entry price to compute P&L from
      // within this day alone, so render the whole group neutral instead of guessing.
      const isCarryover = trade[0].pos_effect === 'TO CLOSE';
      let buyCost = 0, sellRev = 0, netPos = 0;
      for (const ex of trade) {
        if (ex.side === 'buy') { buyCost += ex.qty * ex.price; netPos += ex.qty; }
        else                   { sellRev += ex.qty * ex.price; netPos -= ex.qty; }
      }
      const pnl    = sellRev - buyCost;
      const closed = Math.abs(netPos) < 0.001;
      const lastIdx = trade.length - 1;
      trade.forEach((ex, i) => {
        const ts = execToTimestamp(ex.time, timeMap);
        if (ts == null) return;
        const role = isCarryover ? 'carryover'
          : ex.side === openSide ? 'entry' : (closed && i === lastIdx ? 'exit' : 'partial');
        execRole.set(`${ts}_${ex.side}_${ex.price}`, { role, pnl });
      });

      if (!isCarryover && closed && trade.length > 1) {
        const first = trade[0], last = trade[lastIdx];
        const firstTsBar = execToTimestamp(first.time, posMap);
        const lastTsBar  = execToTimestamp(last.time,  posMap);
        if (firstTsBar != null && lastTsBar != null) {
          tradeLines.push({
            firstTsBar, firstPrice: first.price, lastTsBar, lastPrice: last.price,
            pnl, isRoth: (first.account || '').toLowerCase().includes('roth'),
          });
        }
      }
    }

    function calcRadius() {
      try {
        const spacing = chartInst.timeScale().options().barSpacing;
        return Math.min(Math.max(spacing * 0.18, 6), 13);
      } catch (_) { return 4; }
    }

    function redraw() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      if (!chartInst || !seriesRef) return;
      const timeScale = chartInst.timeScale();
      const r = calcRadius();

      for (const tl of tradeLines) {
        const x1 = timeScale.timeToCoordinate(tl.firstTsBar);
        const y1 = seriesRef.priceToCoordinate(tl.firstPrice);
        const x2 = timeScale.timeToCoordinate(tl.lastTsBar);
        const y2 = seriesRef.priceToCoordinate(tl.lastPrice);
        if (x1 == null || y1 == null || x2 == null || y2 == null) continue;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('stroke', realTradeColor('exit', tl.pnl, tl.isRoth));
        line.setAttribute('stroke-width', '1');
        line.setAttribute('stroke-dasharray', '3,3');
        line.setAttribute('opacity', '0.55');
        svg.appendChild(line);
      }

      for (const m of resolved) {
        const x = timeScale.timeToCoordinate(m.tsBar);
        const y = seriesRef.priceToCoordinate(m.price);
        if (x == null || y == null) continue;

        const isRoth  = (m.account || '').toLowerCase().includes('roth');
        const isPaper = (m.account || '').toLowerCase().includes('paper');
        const info   = execRole.get(`${m.ts}_${m.side}_${m.price}`) || { role: m.side === 'buy' ? 'entry' : 'exit', pnl: 0 };
        const color  = realTradeColor(info.role, info.pnl, isRoth);
        const rad    = info.role === 'partial' ? r * 0.75 : r;
        let dot;
        if (isPaper) {
          dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', rad);
        } else {
          dot = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          dot.setAttribute('points', diamondPoints(x, y, rad));
        }
        dot.setAttribute('fill', color);
        dot.setAttribute('stroke', 'rgba(255,255,255,0.6)');
        dot.setAttribute('stroke-width', '1');
        dot.style.pointerEvents = 'all';
        dot.style.cursor = 'crosshair';

        const sideLabel   = m.side === 'buy' ? 'BUY' : 'SELL';
        const roleLabel   = info.role === 'carryover' ? 'CARRIED OVER'
          : info.role === 'entry' ? 'ENTRY' : info.role === 'partial' ? 'PARTIAL EXIT' : 'EXIT';
        const labelPrefix = isPaper ? 'PAPER ' : '';
        const timeStr     = tsToET(m.ts);
        dot.addEventListener('mouseenter', e => {
          dotTipEl.innerHTML =
            `<span style="color:${color};font-weight:600">${labelPrefix}${roleLabel}</span>&nbsp;&nbsp;$${m.price.toFixed(2)}<br>` +
            `<span style="color:#6b7280;font-size:11px">${sideLabel} &middot; ${timeStr}</span>` +
            (info.role === 'carryover' ? '<br><span style="color:#6b7280;font-size:10px">entered a prior day — P&L not shown here</span>' : '');
          dotTipEl.style.display = 'block';
          dotTipEl.style.left = (e.clientX + 14) + 'px';
          dotTipEl.style.top  = (e.clientY - 36) + 'px';
        });
        dot.addEventListener('mousemove', e => {
          dotTipEl.style.left = (e.clientX + 14) + 'px';
          dotTipEl.style.top  = (e.clientY - 36) + 'px';
        });
        dot.addEventListener('mouseleave', () => {
          dotTipEl.style.display = 'none';
        });

        svg.appendChild(dot);
      }
    }

    redraw();
    requestAnimationFrame(redraw);
    chartInst.timeScale().subscribeVisibleLogicalRangeChange(redraw);
    try { chartInst.priceScale('right').subscribeVisiblePriceRangeChange(redraw); } catch (_) {}

    return () => {
      try { chartInst.timeScale().unsubscribeVisibleLogicalRangeChange(redraw); } catch (_) {}
      try { chartInst.priceScale('right').unsubscribeVisiblePriceRangeChange(redraw); } catch (_) {}
      svg.remove();
    };
  }


  /* ── Background zone primitive ──────────────────── */
  // Attaches to a series and draws colored rectangles behind candles
  // for specified time ranges (pre-market, after-hours).
  function createBgZonePrimitive(zones) {
    return {
      _zones: zones,
      _chart: null,
      attached({ chart }) { this._chart = chart; },
      detached() { this._chart = null; },
      updateAllViews() {},
      paneViews() {
        const self = this;
        return [{
          zOrder() { return 'bottom'; },
          renderer() {
            return {
              draw(target) {
                const chart = self._chart;
                if (!chart) return;
                target.useBitmapCoordinateSpace(({ context: ctx, bitmapSize, horizontalPixelRatio }) => {
                  const ts = chart.timeScale();
                  const W  = bitmapSize.width;
                  const H  = bitmapSize.height;
                  for (const { from, to, color } of self._zones) {
                    const x1m = ts.timeToCoordinate(from);
                    const x2m = ts.timeToCoordinate(to);
                    if (x1m === null && x2m === null) continue;
                    const x1 = x1m === null ? 0 : x1m * horizontalPixelRatio;
                    const x2 = x2m === null ? W : x2m * horizontalPixelRatio;
                    ctx.fillStyle = color;
                    ctx.fillRect(Math.min(x1, x2), 0, Math.abs(x2 - x1), H);
                  }
                });
              },
            };
          },
        }];
      },
    };
  }

  /* ── Indicator calculations ──────────────────────── */
  function calcEMA(candles, period) {
    const k = 2 / (period + 1);
    const result = [];
    let ema = null;
    for (const c of candles) {
      ema = ema === null ? c.close : c.close * k + ema * (1 - k);
      result.push({ time: c.time, value: ema });
    }
    return result;
  }

  function calcVWAP(candles) {
    const result = [];
    let cumVol = 0, cumTPV = 0;
    for (const c of candles) {
      const et   = tsToET(c.time);
      const [h, m] = et.split(':').map(Number);
      const mins = h * 60 + m;
      if (mins === 4 * 60) { cumVol = 0; cumTPV = 0; }         // reset at pre-market open
      const tp = (c.high + c.low + c.close) / 3;
      cumVol  += c.volume;
      cumTPV  += tp * c.volume;
      if (cumVol > 0) result.push({ time: c.time, value: cumTPV / cumVol });
    }
    return result;
  }

  function calcMACD(candles) {
    const k12 = 2 / 10, k26 = 2 / 13, k9 = 2 / 10;  // 9/12/9
    let ema12 = null, ema26 = null, emaSignal = null;
    const macdLine = [], signalLine = [], histogram = [];
    for (const c of candles) {
      ema12 = ema12 === null ? c.close : c.close * k12 + ema12 * (1 - k12);
      ema26 = ema26 === null ? c.close : c.close * k26 + ema26 * (1 - k26);
      const macd = ema12 - ema26;
      emaSignal = emaSignal === null ? macd : macd * k9 + emaSignal * (1 - k9);
      const hist = macd - emaSignal;
      macdLine.push({ time: c.time, value: macd });
      signalLine.push({ time: c.time, value: emaSignal });
      histogram.push({ time: c.time, value: hist,
        color: hist >= 0 ? 'rgba(8,153,129,0.7)' : 'rgba(242,54,69,0.7)' });
    }
    return { macdLine, signalLine, histogram };
  }

  /* ── Timeframe switch ────────────────────────────── */
  function setTimeframe(mins) {
    activeInterval = mins;
    document.querySelectorAll('.tf-btn').forEach(b =>
      b.classList.toggle('active', +b.dataset.tf === mins));
    if (rawCandles) renderChart(rawCandles, displayExecs(), mins);
  }

  /* ── Chart render ────────────────────────────────── */
  function setupPaneHandles(chartInst, outerEl, state) {
    outerEl.querySelectorAll('.pane-handle').forEach(h => h.remove());

    function applyMargins() {
      chartInst.priceScale('right').applyOptions({ scaleMargins: { top: 0.02, bottom: +(1 - state.topFrac).toFixed(4) } });
      chartInst.priceScale('vol').applyOptions({ scaleMargins: { top: +state.topFrac.toFixed(4), bottom: +(1 - state.botFrac).toFixed(4) } });
      chartInst.priceScale('macd').applyOptions({ scaleMargins: { top: +state.botFrac.toFixed(4), bottom: 0 } });
    }

    const storeKey = 'tc_pane1';

    function makeHandle(fracKey, getMin, getMax) {
      const h = document.createElement('div');
      h.className = 'pane-handle';
      h.style.top = (state[fracKey] * 100) + '%';
      let dragging = false;

      h.addEventListener('mousedown', e => {
        dragging = true;
        h.classList.add('dragging');
        e.preventDefault();
        e.stopPropagation();
      });

      const onMove = e => {
        if (!dragging) return;
        const rect = outerEl.getBoundingClientRect();
        const frac = Math.max(getMin(), Math.min(getMax(), (e.clientY - rect.top) / rect.height));
        state[fracKey] = frac;
        h.style.top = (frac * 100) + '%';
        applyMargins();
      };
      const onUp = () => {
        if (dragging) {
          dragging = false;
          h.classList.remove('dragging');
          try { localStorage.setItem(storeKey, JSON.stringify({ topFrac: state.topFrac, botFrac: state.botFrac })); } catch(_) {}
        }
      };

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      outerEl.appendChild(h);
      return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); h.remove(); };
    }

    const c1 = makeHandle('topFrac', () => 0.25, () => state.botFrac - 0.08);
    const c2 = makeHandle('botFrac', () => state.topFrac + 0.08, () => 0.94);
    return () => { c1(); c2(); };
  }

  function renderChart(candles, executions, intervalMins = 1, preserveZoom = false) {
    const bars = aggregateCandles(candles, intervalMins);
    activeBars = bars;
    // Save zoom before teardown if caller wants to preserve it
    const savedRange = (preserveZoom && chartInstance)
      ? chartInstance.timeScale().getVisibleLogicalRange()
      : null;
    // Teardown previous overlays + chart (order matters: unsubscribe before remove)
    if (lpSubCleanup)     { lpSubCleanup();     lpSubCleanup     = null; }
    if (lpSvg)            { lpSvg.remove();     lpSvg            = null; }
    if (rulerState.subCleanup) { rulerState.subCleanup(); rulerState.subCleanup = null; }
    if (rulerState.svg)        { rulerState.svg.remove();  rulerState.svg        = null; }
    if (markerCleanup)    { markerCleanup();    markerCleanup    = null; }
    if (chartInstance) { chartInstance.remove(); chartInstance = null; }
    candleSeriesRef = null;

    const container = document.getElementById('chartMain');
    container.innerHTML = '';

    chartInstance = LightweightCharts.createChart(container, {
      autoSize: true,
      layout: {
        background: { type: 'solid', color: '#000000' },
        textColor: '#9ca3af',
        fontFamily: "'Inter', -apple-system, sans-serif",
        fontSize: 12,
      },
      grid: {
        vertLines: { visible: false },
        horzLines: { visible: false },
      },
      rightPriceScale: {
        borderColor: '#2a2a2a',
        textColor: '#9ca3af',
      },
      timeScale: {
        borderColor: '#2a2a2a',
        timeVisible: true,
        secondsVisible: false,
        fixLeftEdge: false,
        fixRightEdge: false,
        tickMarkFormatter: ts => new Date(ts * 1000).toLocaleTimeString('en-US', {
          timeZone: 'America/New_York',
          hour: '2-digit', minute: '2-digit', hour12: false,
        }),
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: {
          color: '#555', width: 1,
          style: LightweightCharts.LineStyle.Dashed,
          labelBackgroundColor: '#2a2a2a',
        },
        horzLine: {
          color: '#555', width: 1,
          style: LightweightCharts.LineStyle.Dashed,
          labelBackgroundColor: '#2a2a2a',
        },
      },
      localization: {
        timeFormatter: ts => new Date(ts * 1000).toLocaleTimeString('en-US', {
          timeZone: 'America/New_York',
          hour: '2-digit', minute: '2-digit', hour12: false,
        }),
      },
    });

    /* ── Candlestick series ─────────────────────────── */
    const candleSeries = chartInstance.addCandlestickSeries({
      upColor:         'rgb(8,153,129)',
      downColor:       'rgb(242,54,69)',
      borderUpColor:   'rgb(8,153,129)',
      borderDownColor: 'rgb(242,54,69)',
      wickUpColor:     'rgb(8,153,129)',
      wickDownColor:   'rgb(242,54,69)',
    });
    candleSeries.setData(bars);
    candleSeriesRef = candleSeries;

    /* ── Pre-market / after-hours background zones ─── */
    const PRE_COLOR  = 'rgb(22, 26, 52)';
    const POST_COLOR = 'rgb(22, 26, 52)';
    let preStart = null, preEnd = null, postStart = null, postEnd = null;
    let seenOpen = false;
    for (const c of bars) {
      const et   = tsToET(c.time);
      const [h, m] = et.split(':').map(Number);
      const mins = h * 60 + m;
      if (mins >= 9 * 60 + 30 && mins < 16 * 60) {
        if (!seenOpen) { seenOpen = true; preEnd = c.time; } // anchor preEnd to first real bar in session
      } else if (mins < 9 * 60 + 30 && !seenOpen) {
        if (preStart === null) preStart = c.time;
      } else if (mins >= 16 * 60 && seenOpen) {
        if (postStart === null) postStart = c.time;
        postEnd = c.time;
      }
    }
    const bgZones = [];
    if (preStart  !== null) bgZones.push({ from: preStart,  to: preEnd,  color: PRE_COLOR  });
    if (postStart !== null) bgZones.push({ from: postStart, to: postEnd, color: POST_COLOR });
    if (bgZones.length > 0) {
      try { candleSeries.attachPrimitive(createBgZonePrimitive(bgZones)); }
      catch (_) {}
    }

    /* ── Constrain main price scale to top band ─────── */
    chartInstance.priceScale('right').applyOptions({
      scaleMargins: { top: 0.02, bottom: +(1 - paneState1.topFrac).toFixed(4) },
    });

    /* ── Volume histogram ───────────────────────────── */
    const volumeSeries = chartInstance.addHistogramSeries({
      priceFormat:   { type: 'volume' },
      priceScaleId:  'vol',
    });
    chartInstance.priceScale('vol').applyOptions({
      scaleMargins: { top: +paneState1.topFrac.toFixed(4), bottom: +(1 - paneState1.botFrac).toFixed(4) },
    });
    volumeSeries.setData(bars.map(c => ({
      time:  c.time,
      value: c.volume,
      color: c.close >= c.open ? 'rgba(8,153,129,0.35)' : 'rgba(242,54,69,0.35)',
    })));

    /* ── 9 EMA ──────────────────────────────────────── */
    const ema9Series = chartInstance.addLineSeries({
      color:           'rgb(128,255,255)',
      lineWidth:       1,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    ema9Series.setData(calcEMA(bars, 9));

    /* ── 20 EMA ─────────────────────────────────────── */
    const ema20Series = chartInstance.addLineSeries({
      color:           'rgb(0,128,255)',
      lineWidth:       1,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    ema20Series.setData(calcEMA(bars, 20));

    /* ── 200 EMA ────────────────────────────────────── */
    const ema200Series = chartInstance.addLineSeries({
      color:           'rgb(220,50,50)',
      lineWidth:       2,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    ema200Series.setData(calcEMA(bars, 200));

    /* ── VWAP ───────────────────────────────────────── */
    const vwapSeries = chartInstance.addLineSeries({
      color:           'rgb(246,197,72)',
      lineWidth:       1,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    vwapSeries.setData(calcVWAP(bars));

    /* ── MACD ───────────────────────────────────────── */
    const macdData = calcMACD(bars);

    const macdHistSeries = chartInstance.addHistogramSeries({
      priceFormat:      { type: 'price', precision: 4, minMove: 0.0001 },
      priceScaleId:     'macd',
      lastValueVisible: false,
      priceLineVisible: false,
    });
    chartInstance.priceScale('macd').applyOptions({
      scaleMargins: { top: +paneState1.botFrac.toFixed(4), bottom: 0 },
    });
    macdHistSeries.setData(macdData.histogram);

    const macdLineSeries = chartInstance.addLineSeries({
      color:                  'rgb(33,150,243)',
      lineWidth:              1,
      priceScaleId:           'macd',
      lastValueVisible:       false,
      priceLineVisible:       false,
      crosshairMarkerVisible: false,
    });
    macdLineSeries.setData(macdData.macdLine);

    const macdSignalSeries = chartInstance.addLineSeries({
      color:                  'rgb(255,152,0)',
      lineWidth:              1,
      priceScaleId:           'macd',
      lastValueVisible:       false,
      priceLineVisible:       false,
      crosshairMarkerVisible: false,
    });
    macdSignalSeries.setData(macdData.signalLine);

    /* ── Hover tooltip ──────────────────────────────── */
    const ema9Data   = calcEMA(bars, 9);
    const ema20Data  = calcEMA(bars, 20);
    const ema200Data = calcEMA(bars, 200);
    const vwapData  = calcVWAP(bars);
    const barMap      = Object.fromEntries(bars.map(b => [b.time, b]));
    const ema9Map     = Object.fromEntries(ema9Data.map(p => [p.time, p.value]));
    const ema20Map    = Object.fromEntries(ema20Data.map(p => [p.time, p.value]));
    const ema200Map   = Object.fromEntries(ema200Data.map(p => [p.time, p.value]));
    const vwapMap     = Object.fromEntries(vwapData.map(p => [p.time, p.value]));
    const macdLineMap = Object.fromEntries(macdData.macdLine.map(p => [p.time, p.value]));
    const macdSigMap  = Object.fromEntries(macdData.signalLine.map(p => [p.time, p.value]));
    const macdHistMap = Object.fromEntries(macdData.histogram.map(p => [p.time, p.value]));

    const tooltip = document.getElementById('hoverTooltip');
    const fmtP  = v => v != null ? v.toFixed(4) : '—';
    const fmtVol = v => v >= 1e6 ? (v/1e6).toFixed(2)+'M' : v >= 1e3 ? (v/1e3).toFixed(0)+'K' : String(v);

    chartInstance.subscribeCrosshairMove(param => {
      if (!param.time || !param.point) { tooltip.classList.remove('visible'); return; }
      const bar = barMap[param.time];
      if (!bar) { tooltip.classList.remove('visible'); return; }

      const e9   = ema9Map[param.time];
      const e20  = ema20Map[param.time];
      const e200 = ema200Map[param.time];
      const vw  = vwapMap[param.time];
      const mc  = macdLineMap[param.time];
      const ms  = macdSigMap[param.time];
      const mh  = macdHistMap[param.time];
      const time = tsToET(bar.time);
      const ocColor = bar.close >= bar.open ? 'rgb(8,153,129)' : 'rgb(242,54,69)';

      tooltip.innerHTML = `
        <div class="tip-time">${time}</div>
        <div class="tip-row"><span class="tip-label">O</span><span class="tip-val" style="color:${ocColor}">${fmtP(bar.open)}</span></div>
        <div class="tip-row"><span class="tip-label">H</span><span class="tip-val">${fmtP(bar.high)}</span></div>
        <div class="tip-row"><span class="tip-label">L</span><span class="tip-val">${fmtP(bar.low)}</span></div>
        <div class="tip-row"><span class="tip-label">C</span><span class="tip-val" style="color:${ocColor}">${fmtP(bar.close)}</span></div>
        <div class="tip-row"><span class="tip-label" style="color:#6b7280">Vol</span><span class="tip-val" style="color:#6b7280">${fmtVol(bar.volume)}</span></div>
        <div class="tip-divider"></div>
        <div class="tip-row"><span class="tip-label" style="color:rgb(128,255,255)">EMA9</span><span class="tip-val">${fmtP(e9)}</span></div>
        <div class="tip-row"><span class="tip-label" style="color:rgb(0,128,255)">EMA20</span><span class="tip-val">${fmtP(e20)}</span></div>
        <div class="tip-row"><span class="tip-label" style="color:rgb(220,50,50)">EMA200</span><span class="tip-val">${fmtP(e200)}</span></div>
        <div class="tip-row"><span class="tip-label" style="color:rgb(246,197,72)">VWAP</span><span class="tip-val">${fmtP(vw)}</span></div>
        <div class="tip-divider"></div>
        <div class="tip-row"><span class="tip-label" style="color:rgb(33,150,243)">MACD</span><span class="tip-val">${fmtP(mc)}</span></div>
        <div class="tip-row"><span class="tip-label" style="color:rgb(255,152,0)">Signal</span><span class="tip-val">${fmtP(ms)}</span></div>
        <div class="tip-row"><span class="tip-label" style="color:#9ca3af">Hist</span><span class="tip-val" style="color:${mh != null && mh >= 0 ? 'rgb(8,153,129)' : 'rgb(242,54,69)'}">${fmtP(mh)}</span></div>`;
      tooltip.classList.add('visible');
    });

    /* ── Execution markers at exact price ───────────── */
    const timeMap     = buildTimeMap(rawCandles || bars);
    const barsTimeMap = rawCandles ? buildTimeMap(bars) : timeMap;
    const realLabel = document.getElementById('realTradesToggleLabel');
    if (realLabel) realLabel.textContent = `Real trades${executions?.length ? ` (${executions.length})` : ''}`;
    if (execMarkersOn && executions && executions.length > 0) {
      markerCleanup = renderExecMarkers(executions, timeMap, barsTimeMap, {
        chartInst: chartInstance, seriesRef: candleSeriesRef,
        containerId: 'chartMain', dotTipEl: document.getElementById('dotTooltip'),
      });
    }

    // Restore previous zoom or zoom to exec span
    if (savedRange) {
      chartInstance.timeScale().setVisibleLogicalRange(savedRange);
    } else {
      const execTimes = (executions || []).map(e => execToTimestamp(e.time, timeMap)).filter(t => t != null);
      if (execTimes.length > 0) {
        const pad = intervalMins * 60 * 5;
        chartInstance.timeScale().setVisibleRange({
          from: Math.min(...execTimes) - pad,
          to:   Math.max(...execTimes) + pad,
        });
      } else {
        chartInstance.timeScale().fitContent();
      }
    }

    hideStatus();
    document.getElementById('chartLegend').style.display = 'flex';

    // Update chart TF label
    const leftLbl = document.getElementById('leftTfLabel');
    if (leftLbl) leftLbl.textContent = intervalMins + 'm';

    // Restore overlays after chart re-render (e.g. timeframe switch)
    if (longPositions.length && longPosMode) setTimeout(() => renderLongPosOverlay(), 0);
    if ((rulerState.rulers.length || rulerState.activeRuler) && rulerMode) setTimeout(() => renderRulerOverlay(), 0);

    // Pane resize handles
    setupPaneHandles(chartInstance, document.getElementById('chartOuter'), paneState1);
  }

  /* ── Load chart for symbol ───────────────────────── */
  async function loadSymbol(symbol, dayData) {
    activeSymbol = symbol;

    // Clear placed long position when switching symbols (different price range)
    if (longPositions.length) {
      clearLongPosTool();
      if (longPosMode) document.getElementById('chartMain').style.cursor = 'crosshair';
    }

    // Update pill active state
    document.querySelectorAll('.sym-pill').forEach(pill => {
      pill.classList.remove('active-pos', 'active-neg', 'active-zero');
      if (pill.dataset.sym === symbol) {
        const pnl = parseFloat(pill.dataset.pnl || '0');
        pill.classList.add(pnl > 0 ? 'active-pos' : pnl < 0 ? 'active-neg' : 'active-zero');
      }
    });

    showLoading(`Loading 1-min data for ${symbol}…`);
    document.getElementById('chartLegend').style.display = 'none';

    const dateStr = `${curYear}-${String(curMonth).padStart(2,'0')}-${String(curDay).padStart(2,'0')}`;

    allSymbolExecs = (dayData.executions || []).filter(e => e.symbol === symbol);
    activeExecs    = allSymbolExecs;
    activeTrades   = groupExecutionsIntoTrades(activeExecs);

    // Deep-linked from trades.html for one specific roundtrip — lock the view to just it
    if (pendingTradeZoom) {
      const { entryTime, exitTime } = pendingTradeZoom;
      pendingTradeZoom = null; // one-shot: consume regardless of match
      const match = activeTrades.find(grp => {
        const first = grp[0], last = grp[grp.length - 1];
        return first && last && first.time.slice(0, 5) === entryTime && last.time.slice(0, 5) === exitTime;
      });
      if (match) { activeExecs = match; activeTrades = [match]; allSymbolExecs = match; }
    }

    // ── 1. Try local ohlcv_YYYY-MM-DD.json cache ─────
    const localData  = ohlcvCache[symbol];
    if (localData?.length) {
      rawCandles = localData;
      renderChart(rawCandles, displayExecs(), activeInterval);
      return;
    }

    // ── 2. No cached data available ───────────────────
    showError(`No 1-minute data available for ${symbol} on ${dateStr}`,
      'Run fetch_ohlcv.py to pre-fetch this symbol/day.');
  }

  /* ── Render symbol pills ─────────────────────────── */
  function renderPills(symbols, defaultSym, dayData) {
    const container = document.getElementById('symPills');
    container.innerHTML = '';

    // Day pill
    const dayPnl = Object.values(symbols).reduce((s, sd) => s + (sd.pnl || 0), 0);
    const dayCls = dayPnl > 0 ? 'pos' : dayPnl < 0 ? 'neg' : 'zero';
    const dayPill = document.createElement('div');
    dayPill.className = 'sym-pill';
    dayPill.style.cssText = 'cursor:default;border-color:transparent;background:transparent;color:#ffffff;width:fit-content;flex-shrink:0;';
    dayPill.innerHTML = `
      <span class="sym-pill-name">Day</span>
      <span class="sym-pill-stack">
        <span class="pill-sub ${dayCls}"><span class="pill-sub-label">CASH</span>${fmtPnl(dayPnl)}</span>
      </span>`;
    container.appendChild(dayPill);

    const divider = document.createElement('div');
    divider.style.cssText = 'width:1px;background:#333;align-self:stretch;margin:2px 0;flex-shrink:0;';
    container.appendChild(divider);

    const inner = document.createElement('div');
    inner.className = 'sym-pills-inner';

    for (const [sym, sd] of Object.entries(symbols)) {
      const pill    = document.createElement('button');
      pill.className = 'sym-pill';
      pill.dataset.sym = sym;
      pill.dataset.pnl = sd.pnl;
      const cls = sd.pnl > 0 ? 'pos' : sd.pnl < 0 ? 'neg' : 'zero';
      pill.innerHTML = `
        <span class="sym-pill-name">${sym}</span>
        <span class="sym-pill-stack">
          <span class="pill-sub ${cls}"><span class="pill-sub-label">CASH</span>${fmtPnl(sd.pnl || 0)}</span>
        </span>`;

      pill.onclick = () => loadSymbol(sym, dayData);

      inner.appendChild(pill);
    }
    container.appendChild(inner);

    loadSymbol(defaultSym, dayData);
  }

  /* ── Nav helpers ─────────────────────────────────── */
  function buildTradingDays(calData) {
    const days = [];
    for (const yr of Object.keys(calData).sort((a,b) => a-b)) {
      for (const mo of Object.keys(calData[yr]).sort((a,b) => a-b)) {
        for (const dy of Object.keys(calData[yr][mo].days).sort((a,b) => a-b)) {
          days.push({ year: +yr, month: +mo, day: +dy });
        }
      }
    }
    return days;
  }

  function currentIndex() {
    return tradingDays.findIndex(d => d.year === curYear && d.month === curMonth && d.day === curDay);
  }

  function updateNavButtons() {
    const idx = currentIndex();
    const prev = document.getElementById('btnPrev');
    const next = document.getElementById('btnNext');
    prev.classList.toggle('disabled', idx <= 0);
    next.classList.toggle('disabled', idx < 0 || idx >= tradingDays.length - 1);
  }

  function navTo(entry) {
    window.location.href =
      `candlestick-chart.html?year=${entry.year}&month=${entry.month}&day=${entry.day}`;
  }

  /* ── Init ────────────────────────────────────────── */
  const params = new URLSearchParams(window.location.search);
  const hasDateParams = params.has('year') && params.has('month') && params.has('day');
  curYear  = parseInt(params.get('year')  || new Date().getFullYear());
  curMonth = parseInt(params.get('month') || new Date().getMonth() + 1);
  curDay   = parseInt(params.get('day')   || new Date().getDate());
  const paramSym = params.get('symbol') || null;
  const paramEntry = params.get('entry') || null;
  const paramExit  = params.get('exit')  || null;
  if (paramEntry && paramExit) pendingTradeZoom = { entryTime: paramEntry, exitTime: paramExit };

  // Timeframe buttons
  document.querySelectorAll('.tf-btn[data-tf]').forEach(btn => {
    btn.onclick = () => setTimeframe(+btn.dataset.tf);
  });

  // Long position tool — click chart to place entry
  document.getElementById('chartMain').addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();

    // Ruler: click 1 = anchor, click 2 = lock + ready for next ruler
    if (rulerMode && candleSeriesRef) {
      const px   = e.clientX - rect.left;
      const py   = e.clientY - rect.top;
      const snap = snapToCandle(px, py);
      const t    = snap ? snap.time  : chartInstance.timeScale().coordinateToTime(px);
      const p    = snap ? snap.price : candleSeriesRef.coordinateToPrice(py);
      if (t == null || p == null) return;
      const st = rulerState;
      if (!st.activeRuler) {
        st.activeRuler = { t0: t, p0: p, t1: null, p1: null };
        st.liveX = snap ? snap.x : px;
        st.liveY = snap ? snap.y : py;
        renderRulerOverlay();
      } else {
        st.activeRuler.t1 = t; st.activeRuler.p1 = p;
        st.rulers.push(st.activeRuler);
        st.activeRuler = null;
        if (st.svg?._draw) st.svg._draw();
      }
      return;
    }

    if (!longPosMode || !candleSeriesRef) return;
    const price = candleSeriesRef.coordinateToPrice(e.clientY - rect.top);
    if (!price || price <= 0) return;
    const risk = price * 0.01;
    const PSCALE = 72;
    const CW = this.offsetWidth - PSCALE;
    const timeScale = chartInstance.timeScale();
    const clickX = e.clientX - rect.left;
    const t0 = timeScale.coordinateToTime(clickX) ?? rawCandles?.[0]?.time ?? 0;
    const t1 = timeScale.coordinateToTime(CW) ?? rawCandles?.[rawCandles.length - 1]?.time ?? 0;
    longPositions.push({ entry: price, target: price + risk * 2, stop: price - risk, t0, t1 });
    renderLongPosOverlay();
    document.getElementById('longPosPanel').classList.add('visible');
    updateLpInfo();
  });

  // Ruler live preview — track mouse while waiting for second click
  document.getElementById('chartMain').addEventListener('mousemove', function(e) {
    if (!rulerMode || !rulerState.activeRuler) return;
    const rect = this.getBoundingClientRect();
    const px   = e.clientX - rect.left;
    const py   = e.clientY - rect.top;
    const snap = snapToCandle(px, py);
    rulerState.liveX = snap ? snap.x : px;
    rulerState.liveY = snap ? snap.y : py;
    if (rulerState.svg?._draw) rulerState.svg._draw();
  });

  // Update overlay when quantity changes
  document.getElementById('longPosShares').addEventListener('input', () => {
    if (longPositions.length && longPosMode) { renderLongPosOverlay(); updateLpInfo(); }
  });

  // Escape cancels / deactivates tools
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      if (longPosMode) {
        clearLongPosTool();
        longPosMode = false;
        document.getElementById('btnLongPos').classList.remove('active');
        document.getElementById('chartMain').style.cursor = '';
        document.getElementById('chartMain').title = '';
      }
      if (rulerMode) {
        clearRulerTool();
        rulerMode = false;
        document.getElementById('btnRuler').classList.remove('active');
        document.getElementById('chartMain').style.cursor = '';
      }
    }
  });

  // Fullscreen toggle for the chart ('F' key or button)
  (function() {
    const outer = document.getElementById('chartOuter');
    const expand = document.getElementById('fsIconExpand');
    const collapse = document.getElementById('fsIconCollapse');
    function updateIcons() {
      const isFs = document.fullscreenElement === outer || document.webkitFullscreenElement === outer;
      expand.style.display = isFs ? 'none' : '';
      collapse.style.display = isFs ? '' : 'none';
    }
    document.addEventListener('fullscreenchange', updateIcons);
    document.addEventListener('webkitfullscreenchange', updateIcons);
    function toggleFs() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (outer.requestFullscreen || outer.webkitRequestFullscreen).call(outer);
      }
    }
    document.getElementById('btnFullscreen').addEventListener('click', toggleFs);

    document.addEventListener('keydown', ev => {
      if ((ev.key === 'f' || ev.key === 'F') && !ev.ctrlKey && !ev.metaKey && !ev.altKey && document.activeElement?.tagName !== 'INPUT') {
        toggleFs();
      }
    });
  })();

  // Title
  const d = new Date(curYear, curMonth - 1, curDay);
  const titleStr = `${DAYS_OF_WEEK[d.getDay()]}, ${MONTHS[curMonth - 1]} ${ordinal(curDay)} ${curYear}`;
  document.getElementById('pageTitle').textContent = titleStr;
  document.title = `Candlestick — ${titleStr}`;

  async function init() {
    try {
      const ohlcvFile = `ohlcv/ohlcv_${curYear}-${String(curMonth).padStart(2,'0')}-${String(curDay).padStart(2,'0')}.json`;
      const [idx, ohlcv] = await Promise.all([
        fetch('calendar/calendar_index.json').then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
        fetch(ohlcvFile).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      ]);
      ohlcvCache  = ohlcv;

      const files = await Promise.all(idx.years.map(yr =>
        fetch(`calendar/calendar_data_${yr}.json`).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      ));
      const calData = Object.assign({}, ...files);

      tradingDays = buildTradingDays(calData);

      // No date in URL → redirect to the most recent trading day
      if (!hasDateParams && tradingDays.length > 0) {
        navTo(tradingDays[tradingDays.length - 1]);
        return;
      }

      updateNavButtons();

      document.getElementById('btnPrev').onclick = () => {
        const i = currentIndex();
        if (i > 0) navTo(tradingDays[i - 1]);
      };
      document.getElementById('btnNext').onclick = () => {
        const i = currentIndex();
        if (i >= 0 && i < tradingDays.length - 1) navTo(tradingDays[i + 1]);
      };

      const dayData = calData[curYear]?.[curMonth]?.days?.[curDay] || null;

      if (!dayData?.symbols || Object.keys(dayData.symbols).length === 0) {
        showError('No trade data for this day.');
        return;
      }

      const symbols  = dayData.symbols;
      const firstSym = (paramSym && symbols[paramSym]) ? paramSym : Object.keys(symbols)[0];
      renderPills(symbols, firstSym, dayData);
    } catch (err) {
      showError(
        `Error loading data: ${err.message}`,
        `Run <code>python calendar_data.py</code>`
      );
    }
  }

  // Embedded in a chart popup iframe — clamp the page to the iframe's
  // viewport height so nothing forces a vertical scrollbar; the chart absorbs
  // whatever space is left after the header/pills/toolbar above it.
  if (window.self !== window.top) {
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    document.body.style.minHeight = '0';

    const fitChartHeight = () => {
      const outer = document.getElementById('chartOuter');
      if (!outer) return;
      const avail = window.innerHeight - outer.getBoundingClientRect().top - 8;
      document.getElementById('chartMain').style.height = Math.max(200, avail) + 'px';
    };

    const ro = new ResizeObserver(fitChartHeight);
    ['.page-hdr', '#chartLegend', '#longPosPanel'].forEach(sel => {
      const el = document.querySelector(sel);
      if (el) ro.observe(el);
    });
    window.addEventListener('resize', fitChartHeight);
    fitChartHeight();
  }

  init();
</script>

</body>
</html>
